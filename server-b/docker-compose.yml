version: "3.8"

services:
  memory-db:
    image: pgvector/pgvector:pg16
    container_name: staffbot-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: staffbot
      POSTGRES_PASSWORD: ${MEMORY_DB_PASSWORD:-staffbot}
      POSTGRES_DB: staffbot_memory
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - memory_pgdata:/var/lib/postgresql/data
      - ./init-memory.sql:/docker-entrypoint-initdb.d/init-memory.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffbot -d staffbot_memory"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staffbot-b
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID

  api-gateway:
    build: ./gateway
    container_name: staffbot-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://staffbot:***@memory-db:5432/staffbot_memory
      AUTH_KEY: ${GATEWAY_AUTH_KEY:?GATEWAY_AUTH_KEY is required}
      BAILEYS_MANAGER_URL: http://baileys-manager:8653
      TELEGRAM_MANAGER_URL: http://telegram-manager:8654
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/staffbot/containers:/root/staffbot/containers
      - /root/staffbot/auth:/root/staffbot/auth
    depends_on:
      memory-db:
        condition: service_healthy
    networks:
      - staffbot-b
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE

  baileys-manager:
    build: ./baileys-manager
    container_name: staffbot-baileys
    restart: unless-stopped
    ports:
      - "127.0.0.1:8653:8653"
    environment:
      GATEWAY_URL: http://api-gateway:8080
      GATEWAY_AUTH_KEY: ${GATEWAY_AUTH_KEY}
      HTTP_PORT: 8653
      AUTH_BASE: /root/staffbot/auth/whatsapp
    volumes:
      - /root/staffbot/auth:/root/staffbot/auth
    networks:
      - staffbot-b

  telegram-manager:
    build: ./telegram-manager
    container_name: staffbot-telegram
    restart: unless-stopped
    ports:
      - "127.0.0.1:8654:8654"
    environment:
      GATEWAY_URL: http://api-gateway:8080
      GATEWAY_AUTH_KEY: ${GATEWAY_AUTH_KEY}
      HTTP_PORT: 8654
      PUBLIC_URL: https://staffbot.my
    networks:
      - staffbot-b

volumes:
  memory_pgdata:

networks:
  staffbot-b:
    driver: bridge
    ipam:
      config:
        - subnet: "10.100.0.0/24"
