<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div style="text-align:center;margin-bottom:24px">
            <h1 style="font-size:28px;color:var(--primary)">StaffBot.my</h1>
            <p>Digital Employee as a Service</p>
        </div>
        <h1>Welcome</h1>
        <p>Log in to your dashboard</p>
        
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-input" id="email" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-input" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" id="loginBtn">
                Sign In
            </button>
        </form>
        
        <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-light)">
            Don't have an account? <a href="https://staffbot.my" style="color:var(--accent)">Register now</a>
        </div>
        <div style="text-align:center;margin-top:8px">
            <a href="/admin/login.html" style="font-size:13px;color:var(--text-light)">Admin Login</a>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/app.js"></script>
    <script>
    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.textContent = 'Processing...';
        
        try {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await login(email, password);
            window.location.href = '/customer/dashboard.html';
        } catch (err) {
            btn.disabled = false; btn.textContent = 'Sign In';
        }
        return false;
    }
    </script>
</body>
</html>
