<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.tailwindcss.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:;">
    <title>Login — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1780499994">
</head>
<body class="login-page">
    <div class="login-card">
        <div style="text-align:center;margin-bottom:24px">
            <h1 style="font-size:28px;color:var(--primary)">StaffBot.my</h1>
            <p>Digital Employee as a Service</p>
        </div>
        <h1>Welcome</h1>
        <p>Login to your dashboard</p>
        
        <div id="loginError" style="display:none;background:#FEF2F2;color:#991B1B;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;border:1px solid #FECACA;"></div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-input" id="email" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-input" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" id="loginBtn">
                Login
            </button>
        </form>
        
        <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-light)">
            No account yet? <a href="https://staffbot.my" style="color:var(--accent)">Register here</a>
        </div>
        <div style="text-align:center;margin-top:8px">
            <a href="/admin/login.html" style="font-size:13px;color:var(--text-light)">Admin Login</a>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script defer src="/static/js/app.js?v=1780499994"></script>
    <script>
    // Auto-redirect if already logged in
    if (AUTH_TOKEN) {
        fetch('/api/v1/admin/dashboard', {
            headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
        }).then(r => {
            if (r.status === 403) window.location.href = '/customer/dashboard.html';
            else window.location.href = '/admin/dashboard.html';
        }).catch(() => {});
    }

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errDiv = document.getElementById('loginError');
        errDiv.style.display = 'none';
        btn.disabled = true; btn.textContent = 'Processing...';
        
        try {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await login(email, password);
            window.location.href = '/customer/dashboard.html';
        } catch (err) {
            btn.disabled = false; btn.textContent = 'Login';
            errDiv.textContent = err.message || 'Login failed. Please try again.';
            errDiv.style.display = 'block';
        }
        return false;
    }
    </script>
</body>
</html>
