<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.tailwindcss.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:;">
    <title>Chat — StaffBot.my</title>
    <link rel="stylesheet" href="/static/css/app.css?v=1780499994">
    <style>
        .chat-layout { display:flex; flex-direction:column; height:calc(100vh - 120px); max-width:900px; margin:0 auto; }
        .chat-header { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); }
        .chat-header select { padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
        .chat-messages { flex:1; overflow-y:auto; padding:16px 0; display:flex; flex-direction:column; gap:16px; }
        .chat-msg { max-width:80%; padding:12px 16px; border-radius:12px; line-height:1.5; font-size:14px; }
        .chat-user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
        .chat-bot { align-self:flex-start; background:var(--card-bg); border:1px solid var(--border); border-bottom-left-radius:4px; }
        .msg-sender { font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600; }
        .msg-attachments { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
        .msg-attachment { display:flex; align-items:center; gap:6px; padding:4px 10px; background:var(--bg); border-radius:6px; font-size:12px; border:1px solid var(--border); }
        .msg-attachment .remove-attach { cursor:pointer; color:var(--danger); font-weight:bold; font-size:14px; }
        .chat-input-area { padding:12px 0; border-top:1px solid var(--border); }
        .input-row { display:flex; gap:8px; align-items:center; }
        .input-row input[type="text"] { flex:1; padding:10px 14px; border-radius:24px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; }
        .input-row input[type="text"]:focus { outline:none; border-color:var(--accent); }
        .input-row button { padding:10px 20px; border-radius:24px; border:none; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; font-weight:600; }
        .input-row button:disabled { opacity:0.5; cursor:not-allowed; }
        .toolbar-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
        .tool-btn { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:pointer; font-size:12px; display:flex; align-items:center; gap:5px; transition:all .2s; }
        .tool-btn:hover { border-color:var(--accent); }
        .tool-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        .link-popup { display:none; position:absolute; bottom:60px; left:0; right:0; background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:12px; z-index:10; }
        .link-popup.show { display:block; }
        .link-popup input { width:100%; margin-bottom:8px; }
        .drop-zone { display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; border-radius:16px; border:3px dashed var(--accent); }
        .drop-zone.show { display:flex; }
        .drop-zone-inner { text-align:center; color:#fff; }
        .drop-zone-inner span { font-size:40px; }
        .drop-zone-inner p { margin-top:8px; font-size:16px; }
        .loading { display:inline-block; width:20px; height:20px; border:2px solid var(--muted); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; margin-right:8px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .link-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; background:var(--accent); color:#fff; border-radius:12px; font-size:12px; }
        .file-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; background:#5865f2; color:#fff; border-radius:12px; font-size:12px; }
        .chat-input-wrapper { position:relative; }
    </style>
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="chat-layout">
            <div class="chat-header">
                <h2 id="chatTitle">Chat with AI Staff</h2>
                <select id="botSelector" onchange="switchBot()">
                    <option value="">Loading...</option>
                </select>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div style="text-align:center;color:var(--muted);padding:40px 0;">
                    <span style="font-size:48px;">🤖</span>
                    <p style="margin-top:12px;">Start a conversation with your AI Staff.<br>
                    <small>Upload documents or paste links for AI to analyze.</small></p>
                </div>
            </div>
            <div class="chat-input-area">
                <!-- Attachments preview -->
                <div class="msg-attachments" id="attachmentPreview"></div>
                <!-- Toolbar -->
                <div class="toolbar-row">
                    <button class="tool-btn" onclick="document.getElementById('fileInput').click()" title="Upload document">
                        📎 Upload
                    </button>
                    <button class="tool-btn" id="linkBtn" onclick="toggleLinkInput()" title="Paste URL">
                        🔗 Link
                    </button>
                    <input type="file" id="fileInput" style="display:none" accept=".pdf,.docx,.doc,.txt,.md,.csv,.json,.png,.jpg,.jpeg,.gif,.webp" onchange="handleFileUpload(event)" multiple>
                    <span style="font-size:12px;color:var(--muted);margin-left:auto;" id="tokenBadge">
                        Tokens: <span id="tokenBadgeText">...</span>
                    </span>
                </div>
                <!-- Link popup -->
                <div class="link-popup" id="linkPopup">
                    <input type="text" id="linkInput" placeholder="Paste URL (article, PDF, documentation...)" onkeypress="if(event.key==='Enter')extractLink()">
                    <div style="display:flex;gap:6px;">
                        <button class="tool-btn" onclick="extractLink()" style="background:var(--accent);color:#fff;">Extract Content</button>
                        <button class="tool-btn" onclick="toggleLinkInput()">Cancel</button>
                    </div>
                    <small id="linkStatus" style="color:var(--muted);display:none;"></small>
                </div>
                <!-- Message input -->
                <div class="input-row chat-input-wrapper">
                    <input type="text" id="chatInput" placeholder="Type a message... or upload a document first" disabled onkeypress="if(event.key==='Enter')sendMessage()">
                    <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
                </div>
            </div>
            <!-- Drop zone -->
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-inner">
                    <span>📤</span>
                    <p>Drop documents here to upload</p>
                    <small style="color:#aaa;">PDF, DOCX, TXT, images</small>
                </div>
            </div>
        </div>
    </main>
</div>

<script defer src="/static/js/app.js?v=1780499994"></script>
<script>
// ── State ──────────────────────────────────────────
let currentBotId = null;
let currentAgentName = 'AI Staff';
let tokenQuotaExceeded = false;
let pendingAttachments = []; // {filename, text, mime_type, image_base64, pdf_base64}

// ── Init ───────────────────────────────────────────
(async () => {
    if (!AUTH_TOKEN) { location.href = '/customer/login.html'; return; }
    await loadSidebar('sidebar');
    await loadBots();
    await loadTokenStatus();

    // Drag & drop
    const dropZone = document.getElementById('dropZone');
    document.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('show'); });
    document.addEventListener('dragleave', e => { if (!e.relatedTarget || e.relatedTarget === document.documentElement) dropZone.classList.remove('show'); });
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('show');
        if (e.dataTransfer.files.length > 0) processFiles(e.dataTransfer.files);
    });
    document.addEventListener('paste', e => {
        if (e.clipboardData.files.length > 0) {
            e.preventDefault();
            processFiles(e.clipboardData.files);
        }
    });
})();

// ── Bots ───────────────────────────────────────────
async function loadBots() {
    try {
        const bots = await api('/containers/list');
        const sel = document.getElementById('botSelector');
        sel.innerHTML = bots.map(b => `<option value="${b.id}">${escapeHtml(b.agent_name || b.name || 'Bot ' + b.id)}</option>`).join('');
        const params = new URLSearchParams(location.search);
        if (params.get('bot')) sel.value = params.get('bot');
        switchBot();
    } catch (e) { console.error('loadBots:', e); }
}

function switchBot() {
    currentBotId = document.getElementById('botSelector').value;
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('sendBtn');
    const msgs = document.getElementById('chatMessages');
    const sel = document.getElementById('botSelector');

    if (currentBotId) {
        currentAgentName = sel.options[sel.selectedIndex].text;
        document.getElementById('chatTitle').textContent = `Chat with ${currentAgentName}`;
        input.disabled = false;
        btn.disabled = tokenQuotaExceeded;
        input.placeholder = 'Type a message... or upload a document first';
    } else {
        currentAgentName = 'AI Staff';
        document.getElementById('chatTitle').textContent = 'Chat with AI Staff';
        input.disabled = true;
        btn.disabled = true;
    }
    msgs.innerHTML = '';
    pendingAttachments = [];
    renderAttachments();
}

// ── File Upload ────────────────────────────────────
function handleFileUpload(e) {
    if (e.target.files.length > 0) processFiles(e.target.files);
    e.target.value = '';
}

async function processFiles(files) {
    for (const file of files) {
        try {
            appendSystemMessage(`Uploading ${file.name}...`);
            const formData = new FormData();
            formData.append('file', file);

            const resp = await fetch(`${API_BASE}/chat/upload`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` },
                body: formData,
            });

            // Remove "Uploading..." message
            removeSystemMessages();

            if (!resp.ok) {
                const err = await resp.json();
                appendSystemMessage(`❌ ${file.name}: ${err.detail || 'Upload failed'}`);
                continue;
            }

            const data = await resp.json();

            if (data.image_base64) {
                // Show image preview in attachments
                pendingAttachments.push({
                    filename: data.filename,
                    text: data.text,
                    mime_type: data.mime_type,
                    image_base64: data.image_base64,
                });
                renderAttachments();
                appendSystemMessage(`📷 ${data.filename} added — AI can see this image`);
            } else {
                pendingAttachments.push({
                    filename: data.filename,
                    text: data.text,
                });
                renderAttachments();
                appendSystemMessage(`📄 ${data.filename} — ${data.text_length} chars extracted`);
            }
        } catch (e) {
            removeSystemMessages();
            appendSystemMessage(`❌ ${file.name}: ${e.message}`);
        }
    }
}

// ── Link Extraction ────────────────────────────────
function toggleLinkInput() {
    const popup = document.getElementById('linkPopup');
    popup.classList.toggle('show');
    if (popup.classList.contains('show')) {
        document.getElementById('linkInput').focus();
        document.getElementById('linkStatus').style.display = 'none';
    }
}

async function extractLink() {
    const input = document.getElementById('linkInput');
    const url = input.value.trim();
    if (!url) return;

    const status = document.getElementById('linkStatus');
    status.style.display = 'block';
    status.textContent = 'Extracting...';

    try {
        const resp = await api('/chat/extract-link', {
            method: 'POST',
            body: JSON.stringify({ url }),
        });

        if (!resp.success) {
            status.textContent = `❌ ${resp.detail || 'Failed'}`;
            return;
        }

        pendingAttachments.push({
            filename: url.substring(0, 60) + (url.length > 60 ? '...' : ''),
            text: resp.text,
            is_link: true,
        });
        renderAttachments();
        status.textContent = `✅ ${resp.text_length} chars extracted`;
        input.value = '';
        setTimeout(() => { status.style.display = 'none'; toggleLinkInput(); }, 1500);
    } catch (e) {
        status.textContent = `❌ ${e.message}`;
    }
}

// ── Attachments UI ─────────────────────────────────
function renderAttachments() {
    const preview = document.getElementById('attachmentPreview');
    preview.innerHTML = pendingAttachments.map((a, i) => `
        <span class="msg-attachment">
            ${a.is_link ? '🔗' : '📄'} ${a.filename.substring(0, 40)}
            <span class="remove-attach" onclick="removeAttachment(${i})">×</span>
        </span>
    `).join('');
}

function removeAttachment(i) {
    pendingAttachments.splice(i, 1);
    renderAttachments();
}

// ── System Messages ────────────────────────────────
function appendSystemMessage(text) {
    const msgs = document.getElementById('chatMessages');
    const id = 'sys-' + Date.now();
    msgs.innerHTML += `<div class="chat-msg chat-bot" id="${id}" style="font-size:12px;opacity:0.8;">${escapeHtml(text)}</div>`;
    msgs.scrollTop = msgs.scrollHeight;
    return id;
}

function removeSystemMessages() {
    document.querySelectorAll('[id^="sys-"]').forEach(el => el.remove());
}

// ── Send Message ───────────────────────────────────
async function sendMessage() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    const hasAttachments = pendingAttachments.length > 0;

    if (!msg && !hasAttachments) return;
    if (!currentBotId) return;

    if (tokenQuotaExceeded) {
        appendMessage('⚠️ Your token limit has been reached. Please <a href="billing.html" style="color:var(--accent);text-decoration:underline">top up tokens</a> or upgrade your package.', 'bot', 'Token quota exceeded');
        return;
    }

    input.value = '';
    setSending(true);

    // Show attachments in user message
    let displayMsg = msg || '';
    if (hasAttachments) {
        const attachLabels = pendingAttachments.map(a => a.is_link ? `🔗 Link` : `📄 ${a.filename}`).join(', ');
        displayMsg = displayMsg ? `${attachLabels}\n${displayMsg}` : attachLabels;
    }
    appendMessage(displayMsg, 'user');

    // Save attachments for body payload
    const pendingAttachmentsSaved = [...pendingAttachments];
    
    // Build context with attachments
    let fullContent = msg || 'Analyze the attached content';

    if (hasAttachments) {
        const attachmentContext = pendingAttachments.map((a, i) => {
            if (a.image_base64) {
                return `[IMAGE ${i+1}: ${a.filename}]
data:${a.mime_type};base64,${a.image_base64}`;
            }
            return `--- BEGIN DOCUMENT ${i+1}: ${a.filename} ---\n${a.text}\n--- END DOCUMENT ${i+1} ---`;
        }).join('\n\n');
        fullContent = `${attachmentContext}\n\nUSER MESSAGE: ${msg || 'Please analyze the attached content above. Summarize key points and answer any questions.'}`;
    }

    // Clear attachments
    pendingAttachments = [];
    renderAttachments();

    // Show typing
    const msgs = document.getElementById('chatMessages');
    const typingId = 'typing-' + Date.now();
    msgs.innerHTML += `<div class="chat-msg chat-bot" id="${typingId}"><div class="msg-sender">${escapeHtml(currentAgentName)}</div><div class="loading"></div> Thinking...</div>`;
    msgs.scrollTop = msgs.scrollHeight;

    try {
        const resp = await api('/chat/send', {
            method: 'POST',
            const bodyPayload = {
                content: fullContent,
                container_id: parseInt(currentBotId),
                provider: 'mimo',
            };
            const imgAttach = pendingAttachmentsSaved.find(a => a.image_base64);
            if (imgAttach) {
                bodyPayload.image_base64 = imgAttach.image_base64;
            }
        const resp = await api('/chat/send', {
            method: 'POST',
            body: JSON.stringify(bodyPayload)
        });

        // Remove typing
        const typingEl = document.getElementById(typingId);
        if (typingEl) typingEl.remove();

        if (resp.success === false) {
            if (resp.error === 'token_quota_exceeded') {
                tokenQuotaExceeded = true;
                appendMessage('⚠️ <strong>Token limit reached!</strong>', 'bot', 'Quota exceeded');
                loadTokenStatus();
                return;
            }
            if (resp.error === 'no_subscription' || resp.error === 'subscription_inactive') {
                appendMessage('⚠️ ' + (resp.message || 'No active subscription.'), 'bot');
                return;
            }
            appendMessage(`❌ ${resp.message || resp.error || 'Something went wrong.'}`, 'bot');
            return;
        }

        const reply = resp.content || resp.reply || '';
        appendMessage(reply, 'bot', currentAgentName);
    } catch (e) {
        const typingEl = document.getElementById(typingId);
        if (typingEl) typingEl.remove();
        appendMessage('❌ Network error. Please try again.', 'bot');
    }

    setSending(false);
}

// ── Helpers ────────────────────────────────────────
function appendMessage(text, role, sender) {
    const msgs = document.getElementById('chatMessages');
    const cls = role === 'user' ? 'chat-user' : 'chat-bot';
    const senderHtml = role === 'bot' && sender ? `<div class="msg-sender">${sender}</div>` : '';
    msgs.innerHTML += `<div class="chat-msg ${cls}">${senderHtml}${text.replace(/\n/g, '<br>')}</div>`;
    msgs.scrollTop = msgs.scrollHeight;
}

function setSending(disabled) {
    document.getElementById('sendBtn').disabled = disabled;
    document.getElementById('chatInput').disabled = disabled || tokenQuotaExceeded;
    if (!disabled) document.getElementById('chatInput').focus();
}

async function loadTokenStatus() {
    try {
        const resp = await api('/chat/token-status');
        const badge = document.getElementById('tokenBadge');
        const badgeText = document.getElementById('tokenBadgeText');
        if (resp.has_subscription) {
            const pct = resp.percent_used || 0;
            badgeText.textContent = `${formatNum(resp.remaining || 0)} left`;
            badge.style.color = pct > 90 ? 'var(--danger)' : pct > 70 ? '#ffc107' : 'var(--muted)';
        } else {
            badgeText.textContent = 'No quota';
            badge.style.color = 'var(--danger)';
        }
    } catch (e) {}
}

function formatNum(n) {
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n/1000).toFixed(1) + 'K';
    return String(n);
}
</script>
</body>
</html>
