<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1779798256">
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
        <div class="sidebar">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Customer Dashboard</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span>📊</span><span>Dashboard</span></a>
                <a href="bots.html"><span>🤖</span><span>My AI Staff</span></a>
                <a href="chat.html" class="active"><span>💬</span><span>Chat</span></a>
                <a href="settings.html"><span>⚙️</span><span>Settings</span></a>
                <a href="billing.html"><span>💰</span><span>Billing</span></a>
                <a href="usage.html"><span>📈</span><span>Usage</span></a>
                <a href="#" onclick="logout()" style="margin-top:20px;border-top:1px solid rgba(255,255,255,0.1);padding-top:20px"><span>🚪</span><span>Logout</span></a>
            </nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <h1>Chat with AI Staff</h1>
                <div style="display:flex;align-items:center;gap:12px">
                    <select class="form-input" id="botSelector" style="width:200px" onchange="switchBot()">
                        <option value="">Select Staff...</option>
                    </select>
                    <div id="tokenBadge" style="font-size:12px;padding:6px 12px;border-radius:20px;background:var(--bg-secondary);color:var(--text-light);white-space:nowrap;display:none">
                        <span id="tokenBadgeText">Tokens: -</span>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="chat-container" id="chatContainer">
                    <div class="chat-messages" id="chatMessages">
                        <div class="chat-msg chat-bot">
                            Hi! I'm StaffBot.ai. Select an AI staff above to start chatting.
                            <div class="msg-time">Now</div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" class="form-input" id="chatInput" placeholder="Type a message..." disabled onkeypress="if(event.key==='Enter')sendMessage()">
                        <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js?v=1779798256"></script>
    <script>
    let currentBotId = null;
    let tokenQuotaExceeded = false;
    const params = new URLSearchParams(window.location.search);

    async function init() {
        const user = await checkAuth();
        if (!user) return;
        renderSidebarUser(user);
        await Promise.all([loadBots(), loadTokenStatus()]);
        if (params.get('bot')) { document.getElementById('botSelector').value = params.get('bot'); switchBot(); }
    }

    async function loadBots() {
        try {
            const containers = await api('/containers/');
            const sel = document.getElementById('botSelector');
            sel.innerHTML = '<option value="">Select Staff...</option>' + containers.map(c =>
                `<option value="${c.id}">${c.name} (${c.status})</option>`
            ).join('');
        } catch {}
    }

    async function loadTokenStatus() {
        try {
            const status = await api('/chat/token-status');
            const badge = document.getElementById('tokenBadge');
            const badgeText = document.getElementById('tokenBadgeText');
            badge.style.display = 'inline-block';

            if (!status.has_subscription) {
                badge.style.background = 'var(--danger)';
                badge.style.color = 'white';
                badgeText.textContent = 'No subscription';
                return;
            }

            const remaining = status.remaining || 0;
            const quota = status.quota || 0;
            const pct = status.percent_used || 0;

            if (quota > 0) {
                if (remaining <= 0) {
                    badge.style.background = 'var(--danger)';
                    badge.style.color = 'white';
                    badgeText.textContent = 'Tokens: EXHAUSTED';
                    tokenQuotaExceeded = true;
                } else if (pct >= 90) {
                    badge.style.background = 'var(--warning, #f59e0b)';
                    badge.style.color = 'white';
                    badgeText.textContent = `Tokens: ${formatNum(remaining)} left (${Math.round(100 - pct)}%)`;
                } else {
                    badgeText.textContent = `Tokens: ${formatNum(remaining)} left`;
                }
            } else {
                badgeText.textContent = 'Unlimited tokens';
            }
        } catch {
            // Silently fail — badge stays hidden
        }
    }

    function formatNum(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
        return n.toString();
    }

    function switchBot() {
        currentBotId = document.getElementById('botSelector').value;
        const input = document.getElementById('chatInput');
        const btn = document.getElementById('sendBtn');
        const msgs = document.getElementById('chatMessages');

        if (currentBotId) {
            input.disabled = false; btn.disabled = false; input.focus();
            msgs.innerHTML = `<div class="chat-msg chat-bot">AI Staff is ready to help. Type your message.<div class="msg-time">${new Date().toLocaleTimeString()}</div></div>`;
        } else {
            input.disabled = true; btn.disabled = true;
            msgs.innerHTML = `<div class="chat-msg chat-bot">Select an AI staff above to start chatting.<div class="msg-time">Now</div></div>`;
        }
    }

    function appendMessage(text, sender, extra) {
        const msgs = document.getElementById('chatMessages');
        const extraHtml = extra ? `<div style="font-size:11px;color:var(--text-light);margin-top:4px">${extra}</div>` : '';
        msgs.innerHTML += `<div class="chat-msg chat-${sender}">${text}${extraHtml}<div class="msg-time">${new Date().toLocaleTimeString()}</div></div>`;
        msgs.scrollTop = msgs.scrollHeight;
    }

    function setSending(disabled) {
        document.getElementById('sendBtn').disabled = disabled;
        document.getElementById('chatInput').disabled = disabled;
        if (!disabled) document.getElementById('chatInput').focus();
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg || !currentBotId) return;

        // Block if quota exceeded
        if (tokenQuotaExceeded) {
            appendMessage('⚠️ Your token limit has been reached. Please <a href="billing.html" style="color:var(--accent);text-decoration:underline">top up tokens</a> or upgrade your package to continue chatting.', 'bot', 'Token quota exceeded');
            return;
        }

        input.value = '';
        appendMessage(msg, 'user');
        setSending(true);

        // Show typing indicator
        const msgs = document.getElementById('chatMessages');
        const typingId = 'typing-' + Date.now();
        msgs.innerHTML += `<div class="chat-msg chat-bot" id="${typingId}"><div class="loading"></div> Thinking...</div>`;
        msgs.scrollTop = msgs.scrollHeight;

        try {
            const resp = await api('/chat/send', {
                method: 'POST',
                body: JSON.stringify({
                    content: msg,
                    container_id: parseInt(currentBotId),
                    provider: 'mimo'
                })
            });

            // Remove typing indicator
            const typingEl = document.getElementById(typingId);
            if (typingEl) typingEl.remove();

            if (resp.success === false) {
                // Handle specific errors
                if (resp.error === 'token_quota_exceeded') {
                    tokenQuotaExceeded = true;
                    appendMessage(
                        '⚠️ <strong>Token limit reached!</strong><br>You have used all your allocated tokens. To continue chatting, please:<br>• <a href="billing.html" style="color:var(--accent);text-decoration:underline">Top up tokens</a><br>• <a href="billing.html" style="color:var(--accent);text-decoration:underline">Upgrade your package</a>',
                        'bot',
                        'Quota: ' + formatNum(resp.used || 0) + ' / ' + formatNum(resp.quota || 0) + ' used'
                    );
                    loadTokenStatus(); // Refresh badge
                    return;
                }
                if (resp.error === 'no_subscription' || resp.error === 'subscription_inactive') {
                    appendMessage(
                        '⚠️ ' + (resp.message || 'No active subscription.') + '<br><a href="billing.html" style="color:var(--accent);text-decoration:underline">Subscribe now</a>',
                        'bot'
                    );
                    return;
                }
                appendMessage('❌ ' + (resp.message || 'Something went wrong. Please try again.'), 'bot');
                return;
            }

            // Success — show response
            const reply = resp.response || resp.message || resp.content || 'No response received.';
            const tokensUsed = resp.tokens_used || 0;
            const extraParts = [];
            if (tokensUsed > 0) extraParts.push('Tokens: ' + formatNum(tokensUsed));
            if (resp.quota_warning) extraParts.push('⚠️ ' + resp.quota_warning);
            appendMessage(reply, 'bot', extraParts.join(' · '));

            // Refresh token status after each message
            loadTokenStatus();

        } catch (e) {
            const typingEl = document.getElementById(typingId);
            if (typingEl) typingEl.remove();
            appendMessage('❌ Unable to connect to AI Staff. Please try again.', 'bot', e.message || 'Network error');
        }

        setSending(false);
    }

    init();
    </script>
</body>
</html>
