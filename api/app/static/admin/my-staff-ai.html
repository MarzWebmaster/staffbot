<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Staff AI — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1779706646">
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
        
        <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" ><span>📊</span><span>Dashboard</span></a>
                <a href="my-staff-ai.html"  class="active"><span>🤖</span><span>My Staff AI</span></a>
                <a href="chat.html" ><span>💬</span><span>Chat</span></a>
                <a href="billing.html" ><span>💰</span><span>Billing</span></a>
                <a href="usage.html" ><span>📈</span><span>Usage</span></a>
                <a href="settings.html" ><span>⚙️</span><span>Settings</span></a>
                <a href="affiliates.html" ><span>🤝</span><span>Affiliates</span></a>
                <a href="#" onclick="logout()" style="margin-top:20px;border-top:1px solid rgba(255,255,255,0.1);padding-top:20px"><span>🚪</span><span>Logout</span></a>
            </nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar"><h1>🤖 My Staff AI</h1></div>
            <div class="card">
                <div class="card-header"><h3>Your AI Employees</h3></div>
                <div id="staffList"><p style="color:var(--text-light);padding:24px;text-align:center">Loading...</p></div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js?v=1779706646"></script>
    <script>
    async function init() {
        const user = await checkAdminAuth('/admin/login.html');
        if (!user) return;
        renderSidebarUser(user);
        try {
            const data = await api('/admin/staff');
            const list = document.getElementById('staffList');
            if (data.items && data.items.length > 0) {
                list.innerHTML = `<div class="table-container"><table>
                    <tr><th>Name</th><th>Client</th><th>Status</th><th>Package</th><th>Actions</th></tr>
                    ${data.items.map(s => `<tr>
                        <td><strong>${s.name}</strong></td>
                        <td>${s.client_name || '-'}</td>
                        <td>${statusBadge(s.status)}</td>
                        <td>${s.package}</td>
                        <td><button class="btn btn-sm" onclick="window.location.href='chat.html?staff=${s.id}'">Chat</button></td>
                    </tr>`).join('')}
                </table></div>`;
            } else {
                list.innerHTML = '<p style="color:var(--text-light);padding:24px;text-align:center">No AI staff deployed yet. Create a client first.</p>';
            }
        } catch {
            document.getElementById('staffList').innerHTML = '<p style="color:var(--text-light);padding:24px;text-align:center">No AI staff deployed yet.</p>';
        }
    }
    init();
    </script>
</body>
</html>
