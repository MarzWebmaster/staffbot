<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing — StaffBot.my Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1780499994">
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
        <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar"><h1>💰 Billing</h1></div>
            <div class="grid-4" id="billingStats">
                <div class="card stat-card admin-stat admin-stat-green"><div class="stat-label">💰 Total Revenue</div><div class="stat-value" id="billing-revenue">RM0.00</div></div>
                <div class="card stat-card admin-stat admin-stat-blue"><div class="stat-label">📋 Active Subscriptions</div><div class="stat-value" id="billing-active">-</div></div>
                <div class="card stat-card admin-stat admin-stat-amber"><div class="stat-label">⏳ Pending Payments</div><div class="stat-value" id="billing-pending">-</div></div>
                <div class="card stat-card admin-stat admin-stat-purple"><div class="stat-label">📅 This Month</div><div class="stat-value" id="billing-monthly">RM0.00</div></div>
            </div>
            <div class="card admin-card admin-card-green" style="margin-top:16px">
                <div class="card-header">
                    <h3>📄 Invoices</h3>
                    <a href="token-topups.html" class="btn btn-sm btn-primary">💰 Token Top-Up Packages</a>
                </div>
                <div id="invoiceList"><p style="color:var(--text-light);padding:24px;text-align:center">No invoices yet.</p></div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js?v=1780499994"></script>
    <script>
    async function init() {
        const user = await checkAdminAuth('/admin/login.html');
        if (!user) return;
        renderSidebar('billing');
        renderSidebarUser(user);
        try {
            const data = await api('/admin/dashboard');
            document.getElementById('billing-revenue').textContent = formatCurrency(data.total_revenue || 0);
            document.getElementById('billing-active').textContent = data.active_containers || 0;
            if (data.monthly_revenue && data.monthly_revenue.length > 0) {
                document.getElementById('billing-monthly').textContent = formatCurrency(data.monthly_revenue[data.monthly_revenue.length-1].amount);
            }
        } catch {}
    }
    init();
    </script>
</body>
</html>
