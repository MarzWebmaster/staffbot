<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1780500227">
</head>
<body class="login-page">
    <div class="login-card">
        <div style="text-align:center;margin-bottom:24px">
            <h1 style="font-size:28px;color:var(--primary)">StaffBot.my</h1>
            <p>Admin Panel</p>
        </div>
        <h1>Admin Login</h1>
        <p>Exclusive admin access</p>
        <div id="loginError" style="display:none;background:#FEF2F2;color:#991B1B;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;border:1px solid #FECACA;"></div>
        <form onsubmit="return handleLogin(event)">
            <div class="form-group"><label>Admin Email</label><input type="email" class="form-input" id="adminEmail" required></div>
            <div class="form-group"><label>Password</label><input type="password" class="form-input" id="adminPassword" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" id="adminLoginBtn">Admin Login</button>
        </form>
        <div style="text-align:center;margin-top:16px;font-size:13px">
            <a href="/customer/login.html" style="color:var(--text-light)">Customer Login</a>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js?v=1780500227" defer></script>
    <script>
    // Auto-redirect if already logged in
    if (AUTH_TOKEN) {
        fetch('/api/v1/admin/dashboard', {
            headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
        }).then(r => {
            if (r.status === 403) window.location.href = '/customer/dashboard.html';
            else window.location.href = '/admin/dashboard.html';
        }).catch(() => {});
    }

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('adminLoginBtn');
        const errDiv = document.getElementById('loginError');
        errDiv.style.display = 'none';
        btn.disabled = true; btn.textContent = 'Processing...';
        try {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            await login(email, password);
            if (USER_DATA && USER_DATA.email !== email) {
                logout();
                throw new Error('This account is not an admin');
            }
            window.location.href = 'dashboard.html';
        } catch(err) {
            btn.disabled = false; btn.textContent = 'Admin Login';
            errDiv.textContent = err.message || 'Login failed. Please try again.';
            errDiv.style.display = 'block';
        }
        return false;
    }
    </script>
</body>
</html>
