<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1780497829">
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
        
                <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar"><h1>📈 Usage Analytics</h1></div>
            <div class="grid-4" id="usageStats">
                <div class="card stat-card admin-stat admin-stat-blue"><div class="stat-label">⚡ Total Tokens</div><div class="stat-value" id="usage-total">-</div></div>
                <div class="card stat-card admin-stat admin-stat-green"><div class="stat-label">📞 API Calls Today</div><div class="stat-value" id="usage-today">-</div></div>
                <div class="card stat-card admin-stat admin-stat-purple"><div class="stat-label">👥 Active Today</div><div class="stat-value" id="usage-active-clients">-</div></div>
                <div class="card stat-card admin-stat admin-stat-amber"><div class="stat-label">📊 Avg Tokens/Call</div><div class="stat-value" id="usage-avg">-</div></div>
            </div>
            <div class="inline-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
                <div class="card admin-card admin-card-purple" style="border-radius:12px">
                    <div class="card-header"><h3>📈 Daily Token Usage</h3></div>
                    <div style="padding:16px">
                        <canvas id="dailyTokenChart" height="200"></canvas>
                        <p id="dailyTokenEmpty" style="text-align:center;color:var(--text-light);padding:40px;display:none">No data yet.</p>
                    </div>
                </div>
                <div class="card admin-card admin-card-green" style="border-radius:12px">
                    <div class="card-header"><h3>👤 Usage by Client</h3></div>
                    <div id="usageByClient"><p style="color:var(--text-light);padding:24px;text-align:center">No data yet.</p></div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js?v=1780499744"></script>
    <script>
    async function init() {
        const user = await checkAdminAuth('/admin/login.html');
        if (!user) return;
                renderSidebar('usage');
        renderSidebarUser(user);
        try {
            const data = await api('/admin/usage/tokens');
            if (data.labels && data.labels.length > 0) {
                const total = data.values.reduce((a,b)=>a+b, 0);
                document.getElementById('usage-total').textContent = total >= 1000 ? (total/1000).toFixed(1)+'K' : total;
                document.getElementById('usage-today').textContent = data.values[data.values.length-1] || 0;
                document.getElementById('usage-active-clients').textContent = data.active_clients || 0;
                document.getElementById('usage-avg').textContent = data.avg_per_call || 0;
                renderDailyChart(data);
            } else {
                document.getElementById('dailyTokenEmpty').style.display = 'block';
                document.getElementById('dailyTokenChart').style.display = 'none';
            }
        } catch {}
        try {
            const byClient = await api('/admin/usage/by-client');
            if (byClient.items && byClient.items.length > 0) {
                const container = document.getElementById('usageByClient');
                container.innerHTML = `<div class="table-container"><table>
                    <tr><th>Client</th><th>Package</th><th>Tokens Used</th><th>API Calls</th></tr>
                    ${byClient.items.map(c => `<tr>
                        <td><strong>${c.name}</strong></td>
                        <td>${c.package}</td>
                        <td>${c.tokens >= 1000 ? (c.tokens/1000).toFixed(1)+'K' : c.tokens}</td>
                        <td>${c.calls}</td>
                    </tr>`).join('')}
                </table></div>`;
            }
        } catch {}
    }
    function renderDailyChart(data) {
        const ctx = document.getElementById('dailyTokenChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: [{
                    label: 'Tokens',
                    data: data.values,
                    borderColor: 'rgba(139,92,246,1)',
                    backgroundColor: 'rgba(139,92,246,0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { callback: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v } } }
            }
        });
    }
    init();
    </script>
</body>
</html>
