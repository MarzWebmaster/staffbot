<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Providers — StaffBot.my</title><style>
@media (max-width: 768px) {
    html, body { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
    .app-layout { display: block !important; width: 100% !important; max-width: 100% !important; margin: 0 !important; }
    .main-content { margin: 0 !important; margin-left: 0 !important; width: 100vw !important; max-width: 100vw !important; padding: 12px !important; padding-top: 56px !important; box-sizing: border-box !important; flex: none !important; float: none !important; display: block !important; }
    .sidebar-toggle { display: flex !important; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; }
    .sidebar-overlay.active { display: block; }
    .sidebar { transform: translateX(-100%) !important; transition: transform 0.3s ease !important; }
    .sidebar.open { transform: translateX(0) !important;  }
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr !important; gap: 12px !important; }
    #adminStats.grid-4, #affiliateStats.grid-4, #billingStats.grid-4 { grid-template-columns: 1fr 1fr !important; gap: 12px !important; }
    .mobile-grid-2 { grid-template-columns: 1fr !important; max-width: 100% !important; }
    .mobile-grid-3 { grid-template-columns: 1fr !important; max-width: 100% !important; }
    .card { padding: 14px !important; max-width: 100% !important; overflow-wrap: break-word !important; }
    .stat-card .stat-value { font-size: 22px !important; }
    .table-container { overflow-x: auto !important; max-width: 100% !important; }
    .table-container table { min-width: 100% !important; }
    .modal { width: 95vw !important; max-width: 95vw !important; }
    .btn { padding: 12px 20px !important; min-height: 44px !important; }
}
@media (max-width: 480px) {
    #adminStats.grid-4, #affiliateStats.grid-4, #billingStats.grid-4 { grid-template-columns: 1fr !important; }
    .modal { width: 100vw !important; max-width: 100vw !important; border-radius: 0 !important; }
}
</style><script>
function toggleSidebar() {
    var s = document.querySelector('.sidebar');
    var o = document.querySelector('.sidebar-overlay');
    if (!s) return;
    if (s.classList.contains('open')) {
        s.classList.remove('open');
        if (o) o.classList.remove('active');
    } else {
        s.classList.add('open');
        if (o) o.classList.add('active');
    }
}
</script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=200">
</head>
<body>

    <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
        <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <h1>🔌 LLM Providers</h1>
                <button class="btn btn-primary" onclick="openModal('addProviderModal')">+ Add Provider</button>
            </div>

            <div class="card">
                <div class="card-header"><h3>Provider List</h3></div>
                <div style="overflow-x:auto">
                    <table class="data-table" id="providersTable">
                        <thead><tr><th>Name</th><th>Base URL</th><th>Models</th><th>API Key</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="providersBody"><tr><td colspan="6" style="text-align:center;color:var(--text-light)">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h3>Per-Provider Package Assignment</h3><button class="btn btn-sm btn-primary" onclick="openAssignModal()">+ Assign</button></div>
                <div style="overflow-x:auto">
                    <table class="data-table" id="assignTable">
                        <thead><tr><th>Provider</th><th>Package</th><th>Token Quota</th><th>Available</th><th>Actions</th></tr></thead>
                        <tbody id="assignBody"><tr><td colspan="5" style="text-align:center;color:var(--text-light)">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Provider Modal -->
    <div class="modal-overlay" id="addProviderModal">
        <div class="modal">
            <div class="modal-header"><h3>Add Provider</h3><button class="modal-close" onclick="closeModal('addProviderModal')">&times;</button></div>
            <form onsubmit="addProvider(event)">
                <div class="modal-body">
                    <div class="form-group"><label>Name (slug)</label><input type="text" id="provName" class="form-control" placeholder="openrouter" required></div>
                    <div class="form-group"><label>Display Name</label><input type="text" id="provDisplay" class="form-control" placeholder="OpenRouter" required></div>
                    <div class="form-group"><label>Base URL</label><input type="url" id="provUrl" class="form-control" placeholder="https://openrouter.ai/api/v1" required></div>
                    <div class="form-group"><label>API Key (managed)</label><input type="password" id="provKey" class="form-control" placeholder="sk-..."></div>
                    <div class="form-group"><label>Models (JSON array)</label><textarea id="provModels" class="form-control" rows="3" placeholder='["gpt-4o", "claude-sonnet-4"]'></textarea></div>
                    <div class="form-group"><label>Default Model</label><input type="text" id="provDefault" class="form-control" placeholder="gpt-4o-mini"></div>
                    <div class="form-group"><label>Description</label><textarea id="provDesc" class="form-control" rows="2" placeholder="Provider description"></textarea></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="closeModal('addProviderModal')">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
            </form>
        </div>
    </div>

    <!-- Edit Provider Modal -->
    <div class="modal-overlay" id="editProviderModal">
        <div class="modal">
            <div class="modal-header"><h3>Edit Provider</h3><button class="modal-close" onclick="closeModal('editProviderModal')">&times;</button></div>
            <form onsubmit="editProvider(event)">
                <div class="modal-body">
                    <input type="hidden" id="editProvId">
                    <div class="form-group"><label>Display Name</label><input type="text" id="editProvDisplay" class="form-control" required></div>
                    <div class="form-group"><label>Base URL</label><input type="url" id="editProvUrl" class="form-control" required></div>
                    <div class="form-group"><label>API Key (leave blank to keep current)</label><input type="password" id="editProvKey" class="form-control" placeholder="sk-..."></div>
                    <div class="form-group"><label>Models (JSON array)</label><textarea id="editProvModels" class="form-control" rows="3"></textarea></div>
                    <div class="form-group"><label>Default Model</label><input type="text" id="editProvDefault" class="form-control"></div>
                    <div class="form-group"><label>Description</label><textarea id="editProvDesc" class="form-control" rows="2"></textarea></div>
                    <div class="form-group"><label><input type="checkbox" id="editProvActive"> Active</label></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="closeModal('editProviderModal')">Cancel</button><button type="submit" class="btn btn-primary">Update</button></div>
            </form>
        </div>
    </div>

    <!-- Assign Provider to Package Modal -->
    <div class="modal-overlay" id="assignModal">
        <div class="modal">
            <div class="modal-header"><h3>Assign Provider to Package</h3><button class="modal-close" onclick="closeModal('assignModal')">&times;</button></div>
            <form onsubmit="assignProvider(event)">
                <div class="modal-body">
                    <div class="form-group"><label>Package</label><select id="assignPkgId" class="form-control" required><option value="">-- Select Package --</option></select></div>
                    <div class="form-group"><label>Provider</label><select id="assignProvId" class="form-control" required><option value="">-- Select Provider --</option></select></div>
                    <div class="form-group"><label>Token Quota (0 = use package default)</label><input type="number" id="assignTokens" class="form-control" value="0"></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="closeModal('assignModal')">Cancel</button><button type="submit" class="btn btn-primary">Assign</button></div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script>
    async function init() {
        const user = await checkAuth('/admin/login.html');
        if (!user) return;
        renderSidebarUser(user);
        renderSidebar('providers');
        await loadProviders();
        await loadAssignments();
    }

    async function loadProviders() {
        try {
            const providers = await api('/admin/providers/providers');
            const tbody = document.getElementById('providersBody');
            if (!providers.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-light)">No providers yet.</td></tr>';
                return;
            }
            tbody.innerHTML = providers.map(p => `
                <tr>
                    <td><strong>${p.display_name}</strong><br><small style="color:var(--text-light)">${p.name}</small></td>
                    <td style="font-size:13px">${p.base_url}</td>
                    <td style="font-size:13px">${(p.models||[]).length} models<br><small style="color:var(--text-light)">Default: ${p.default_model||'-'}</small></td>
                    <td>${p.api_key_configured ? '<span class="status-badge status-active">✓ Configured</span>' : '<span class="status-badge status-error">✗ Not Set</span>'}</td>
                    <td>${p.is_active ? '<span class="status-badge status-active">Active</span>' : '<span class="status-badge status-error">Inactive</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-ghost" onclick="openEditProvider(${p.id})">✏️</button>
                        <button class="btn btn-sm btn-ghost" onclick="toggleProvider(${p.id},${!p.is_active})">${p.is_active ? '🚫' : '✅'}</button>
                    </td>
                </tr>
            `).join('');
        } catch {}
    }

    // ── Open Assign Modal with dropdowns ────────────────────────
    async function openAssignModal() {
        // Load packages dropdown
        try {
            const packages = await api('/admin/packages/');
            const pkgSelect = document.getElementById('assignPkgId');
            pkgSelect.innerHTML = '<option value="">-- Select Package --</option>' +
                packages.map(p => `<option value="${p.id}">${p.name || 'Package #'+p.id}</option>`).join('');
        } catch { document.getElementById('assignPkgId').innerHTML = '<option value="">Error loading packages</option>'; }

        // Load providers dropdown
        try {
            const providers = await api('/admin/providers/providers');
            const provSelect = document.getElementById('assignProvId');
            provSelect.innerHTML = '<option value="">-- Select Provider --</option>' +
                providers.map(p => `<option value="${p.id}">${p.display_name}</option>`).join('');
        } catch { document.getElementById('assignProvId').innerHTML = '<option value="">Error loading providers</option>'; }

        openModal('assignModal');
    }

    // ── Edit Assignment (open modal pre-filled) ──────────────────
    async function openEditAssignment(id) {
        try {
            const assigns = await api('/admin/providers/package-providers');
            const a = assigns.find(x => x.id === id);
            if (!a) { showToast('Assignment not found', 'error'); return; }
            
            // Load dropdowns
            const packages = await api('/admin/packages/');
            const pkgSelect = document.getElementById('assignPkgId');
            pkgSelect.innerHTML = '<option value="">-- Select Package --</option>' +
                packages.map(p => `<option value="${p.id}" ${p.id === a.package_id ? 'selected' : ''}>${p.name || 'Package #'+p.id}</option>`).join('');

            const providers = await api('/admin/providers/providers');
            const provSelect = document.getElementById('assignProvId');
            provSelect.innerHTML = '<option value="">-- Select Provider --</option>' +
                providers.map(p => `<option value="${p.id}" ${p.id === a.provider_id ? 'selected' : ''}>${p.display_name}</option>`).join('');

            document.getElementById('assignTokens').value = a.token_quota || 0;
            
            // Store assignment id for update
            document.getElementById('assignModal').dataset.editId = id;
            
            openModal('assignModal');
        } catch { showToast('Error loading assignment data', 'error'); }
    }

    // ── Override assignProvider to handle edit vs create ─────────
    async function assignProvider(e) {
        e.preventDefault();
        const package_id = parseInt(document.getElementById('assignPkgId').value);
        const provider_id = parseInt(document.getElementById('assignProvId').value);
        const token_quota = parseFloat(document.getElementById('assignTokens').value) || 0;
        const editId = document.getElementById('assignModal').dataset.editId;

        try {
            if (editId) {
                await api('/admin/providers/package-providers/' + editId, {
                    method: 'PUT',
                    body: JSON.stringify({ token_quota, is_available: true }),
                });
                showToast('Assignment updated', 'success');
            } else {
                await api('/admin/providers/package-providers?package_id=' + package_id, {
                    method: 'POST',
                    body: JSON.stringify({ provider_id, token_quota, is_available: true }),
                });
                showToast('Provider assigned to package', 'success');
            }
            closeModal('assignModal');
            delete document.getElementById('assignModal').dataset.editId;
            document.getElementById('assignModal').querySelector('form').reset();
            await loadAssignments();
        } catch (e) {
            showToast('Error: ' + (e.message || 'Unknown'), 'error');
        }
    }

    // ── Override removeAssignment with confirmation ──────────────
    async function removeAssignment(id) {
        if (!confirm('Remove provider from this package?')) return;
        try {
            await api('/admin/providers/package-providers/' + id, { method: 'DELETE' });
            showToast('Assignment removed', 'success');
            await loadAssignments();
        } catch { showToast('Error removing assignment', 'error'); }
    }

    // ── Also add an edit button to the table ─────────────────────
    // Override loadAssignments to show edit + delete
    async function loadAssignments() {
        try {
            const assigns = await api('/admin/providers/package-providers');
            const tbody = document.getElementById('assignBody');
            if (!assigns.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-light)">No assignments.</td></tr>';
                return;
            }
            tbody.innerHTML = assigns.map(a => `
                <tr>
                    <td>${a.provider ? a.provider.display_name : 'ID: '+a.provider_id}</td>
                    <td>${'Package #'+a.package_id}</td>
                    <td>${a.token_quota > 0 ? a.token_quota.toLocaleString() : 'Package default'}</td>
                    <td>${a.is_available ? '<span class="status-badge status-active">Yes</span>' : '<span class="status-badge status-error">No</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-ghost" onclick="openEditAssignment(${a.id})">✏️</button>
                        <button class="btn btn-sm btn-ghost" onclick="removeAssignment(${a.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        } catch {}
    }

    init();
    </script>
</body>
</html>
