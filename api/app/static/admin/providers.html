<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Providers — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1780388378">
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
                
                <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <h1>🔌 LLM Providers</h1>
                <button class="btn btn-primary" onclick="openModal('addProviderModal')">+ Add Provider</button>
            </div>

            <!-- Provider List -->
            <div class="card admin-card admin-card-indigo" style="border-radius:12px">
                <div class="card-header"><h3>🔌 Provider List</h3></div>
                <div style="overflow-x:auto">
                    <table class="data-table" id="providersTable">
                        <thead><tr><th>Name</th><th>Base URL</th><th>Models</th><th>API Key</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="providersBody"><tr><td colspan="6" style="text-align:center;color:var(--text-light)">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>

            <!-- Package Assignments -->
            <div class="card admin-card admin-card-purple" style="border-radius:12px;margin-top:16px">
                <div class="card-header"><h3>📋 Per-Provider Package Assignment</h3><button class="btn btn-primary btn-sm" onclick="openAssignModal()">+ Assign</button></div>
                <div style="overflow-x:auto">
                    <table class="data-table" id="assignTable">
                        <thead><tr><th>Provider</th><th>Package</th><th>Token Quota</th><th>Available</th><th>Actions</th></tr></thead>
                        <tbody id="assignBody"><tr><td colspan="5" style="text-align:center;color:var(--text-light)">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Provider Modal -->
    <div class="modal-overlay" id="addProviderModal">
        <div class="modal">
            <div class="modal-header"><h3>Add Provider</h3><button class="modal-close" onclick="closeModal('addProviderModal')">&times;</button></div>
            <form onsubmit="addProvider(event)">
                <div class="modal-body">
                    <div class="form-group"><label>Name (slug)</label><input type="text" id="provName" class="form-control" placeholder="openrouter" required></div>
                    <div class="form-group"><label>Display Name</label><input type="text" id="provDisplay" class="form-control" placeholder="OpenRouter" required></div>
                    <div class="form-group"><label>Base URL</label><input type="url" id="provUrl" class="form-control" placeholder="https://openrouter.ai/api/v1" required></div>
                    <div class="form-group"><label>API Key (managed)</label><input type="password" id="provKey" class="form-control" placeholder="sk-..."></div>
                    <div class="form-group"><label>Models (JSON array)</label><textarea id="provModels" class="form-control" rows="3" placeholder='["gpt-4o", "claude-sonnet-4"]'></textarea></div>
                    <div class="form-group"><label>Default Model</label><input type="text" id="provDefault" class="form-control" placeholder="gpt-4o-mini"></div>
                    <div class="form-group"><label>Description</label><textarea id="provDesc" class="form-control" rows="2" placeholder="Provider description"></textarea></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="closeModal('addProviderModal')">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
            </form>
        </div>
    </div>

    <!-- Edit Provider Modal -->
    <div class="modal-overlay" id="editProviderModal">
        <div class="modal">
            <div class="modal-header"><h3>Edit Provider</h3><button class="modal-close" onclick="closeModal('editProviderModal')">&times;</button></div>
            <form onsubmit="editProvider(event)">
                <div class="modal-body">
                    <input type="hidden" id="editProvId">
                    <div class="form-group"><label>Display Name</label><input type="text" id="editProvDisplay" class="form-control" required></div>
                    <div class="form-group"><label>Base URL</label><input type="url" id="editProvUrl" class="form-control" required></div>
                    <div class="form-group"><label>API Key (leave empty to keep current)</label><input type="password" id="editProvKey" class="form-control" placeholder="sk-..."></div>
                    <div class="form-group"><label>Models (JSON array)</label><textarea id="editProvModels" class="form-control" rows="3"></textarea></div>
                    <div class="form-group"><label>Default Model</label><input type="text" id="editProvDefault" class="form-control"></div>
                    <div class="form-group"><label>Description</label><textarea id="editProvDesc" class="form-control" rows="2"></textarea></div>
                    <div class="form-group"><label><input type="checkbox" id="editProvActive"> Active</label></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="closeModal('editProviderModal')">Cancel</button><button type="submit" class="btn btn-primary">Update</button></div>
            </form>
        </div>
    </div>

    <!-- Assign Provider to Package Modal -->
    <div class="modal-overlay" id="assignModal">
        <div class="modal">
            <div class="modal-header"><h3>Assign Provider to Package</h3><button class="modal-close" onclick="closeModal('assignModal')">&times;</button></div>
            <form onsubmit="assignProvider(event)">
                <div class="modal-body">
                    <div class="form-group"><label>Package</label><select id="assignPkgId" class="form-control" required><option value="">— Select Package —</option></select></div>
                    <div class="form-group"><label>Provider</label><select id="assignProvId" class="form-control" required><option value="">— Select Provider —</option></select></div>
                    <div class="form-group"><label>Token Quota (0 = use package default)</label><input type="number" id="assignTokens" class="form-control" value="0" min="0"></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="closeModal('assignModal')">Cancel</button><button type="submit" class="btn btn-primary">Assign</button></div>
            </form>
        </div>
    </div>

    <!-- Edit Assignment Modal -->
    <div class="modal-overlay" id="editAssignModal">
        <div class="modal">
            <div class="modal-header"><h3>Edit Assignment</h3><button class="modal-close" onclick="closeModal('editAssignModal')">&times;</button></div>
            <form onsubmit="editAssignment(event)">
                <div class="modal-body">
                    <input type="hidden" id="editAssignId">
                    <div class="form-group"><label>Token Quota</label><input type="number" id="editAssignQuota" class="form-control" min="0" step="100000"></div>
                    <div class="form-group"><label><input type="checkbox" id="editAssignAvailable"> Available</label></div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="closeModal('editAssignModal')">Cancel</button><button type="submit" class="btn btn-primary">Update</button></div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js?v=1779798256"></script>
    <script>
    let _packages = [];
    let _providers = [];

    async function init() {
        const user = await checkAdminAuth('/admin/login.html');
        if (!user) return;
        renderSidebar('providers');
        renderSidebarUser(user);
        // Preload packages for name lookup
        try { _packages = await api('/admin/packages/'); } catch { _packages = []; }
        await loadProviders();
        await loadAssignments();
    }

    async function loadProviders() {
        try {
            _providers = await api('/admin/providers/providers');
            const tbody = document.getElementById('providersBody');
            if (!_providers.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-light)">No providers yet.</td></tr>';
                return;
            }
            tbody.innerHTML = _providers.map(p => `
                <tr>
                    <td><strong>${p.display_name}</strong><br><small style="color:var(--text-light)">${p.name}</small></td>
                    <td style="font-size:13px">${p.base_url}</td>
                    <td style="font-size:13px">${(p.models||[]).length} models<br><small style="color:var(--text-light)">Default: ${p.default_model||'-'}</small></td>
                    <td>${p.api_key_configured ? '<span class="status-badge status-active">✓ Configured</span>' : '<span class="status-badge status-error">✗ Not Set</span>'}</td>
                    <td>${p.is_active ? '<span class="status-badge status-active">Active</span>' : '<span class="status-badge status-error">Inactive</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-ghost" onclick="openEditProvider(${p.id})" title="Edit">✏️</button>
                        <button class="btn btn-sm btn-ghost" onclick="toggleProvider(${p.id},${!p.is_active})" title="${p.is_active ? 'Deactivate' : 'Activate'}">${p.is_active ? '🚫' : '✅'}</button>
                        <button class="btn btn-sm btn-ghost" onclick="deleteProvider(${p.id},'${p.display_name.replace(/'/g,"\\'")}')" title="Delete" style="color:var(--danger)">🗑️</button>
                    </td>
                </tr>
            `).join('');
        } catch {}
    }

    async function loadAssignments() {
        try {
            const assigns = await api('/admin/providers/package-providers');
            const tbody = document.getElementById('assignBody');
            if (!assigns || !assigns.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-light)">No assignments yet.</td></tr>';
                return;
            }
            // Build package ID → name lookup
            const pkgMap = {};
            for (const pkg of _packages) { pkgMap[pkg.id] = pkg.display_name; }
            tbody.innerHTML = assigns.map(a => `
                <tr>
                    <td>${a.provider ? a.provider.display_name : 'ID: '+a.provider_id}</td>
                    <td>${pkgMap[a.package_id] || 'Package #'+a.package_id}</td>
                    <td>${a.token_quota > 0 ? Number(a.token_quota).toLocaleString() : 'Package default'}</td>
                    <td>${a.is_available ? '<span class="status-badge status-active">Yes</span>' : '<span class="status-badge status-error">No</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-ghost" onclick="openEditAssignment(${a.id},${a.token_quota||0},${a.is_available})" title="Edit">✏️</button>
                        <button class="btn btn-sm btn-ghost" onclick="removeAssignment(${a.id})" title="Remove" style="color:var(--danger)">🗑️</button>
                    </td>
                </tr>
            `).join('');
        } catch {}
    }

    async function addProvider(e) {
        e.preventDefault();
        const name = document.getElementById('provName').value.trim();
        const display_name = document.getElementById('provDisplay').value.trim();
        const base_url = document.getElementById('provUrl').value.trim();
        const api_key = document.getElementById('provKey').value.trim() || undefined;
        let models = [];
        try { models = JSON.parse(document.getElementById('provModels').value || '[]'); } catch {}
        const default_model = document.getElementById('provDefault').value.trim() || undefined;
        const description = document.getElementById('provDesc').value.trim() || undefined;

        try {
            await api('/admin/providers/providers', {
                method: 'POST',
                body: JSON.stringify({ name, display_name, base_url, api_key, models, default_model, description }),
            });
            showToast('Provider added successfully', 'success');
            closeModal('addProviderModal');
            document.getElementById('addProviderModal').querySelector('form').reset();
            await loadProviders();
        } catch {}
    }

    function openEditProvider(id) {
        api('/admin/providers/providers/' + id).then(p => {
            document.getElementById('editProvId').value = p.id;
            document.getElementById('editProvDisplay').value = p.display_name;
            document.getElementById('editProvUrl').value = p.base_url;
            document.getElementById('editProvModels').value = JSON.stringify(p.models||[], null, 2);
            document.getElementById('editProvDefault').value = p.default_model||'';
            document.getElementById('editProvDesc').value = p.description||'';
            document.getElementById('editProvActive').checked = p.is_active;
            document.getElementById('editProvKey').value = '';
            openModal('editProviderModal');
        }).catch(() => showToast('Failed to load provider data', 'error'));
    }

    async function editProvider(e) {
        e.preventDefault();
        const id = document.getElementById('editProvId').value;
        const display_name = document.getElementById('editProvDisplay').value.trim();
        const base_url = document.getElementById('editProvUrl').value.trim();
        const api_key = document.getElementById('editProvKey').value.trim() || undefined;
        let models;
        try { models = JSON.parse(document.getElementById('editProvModels').value || '[]'); } catch { models = undefined; }
        const default_model = document.getElementById('editProvDefault').value.trim() || undefined;
        const description = document.getElementById('editProvDesc').value.trim() || undefined;
        const is_active = document.getElementById('editProvActive').checked;

        try {
            const body = { display_name, base_url, models, default_model, description, is_active };
            if (api_key) body.api_key = api_key;
            await api('/admin/providers/providers/' + id, { method: 'PUT', body: JSON.stringify(body) });
            showToast('Provider updated', 'success');
            closeModal('editProviderModal');
            await loadProviders();
        } catch {}
    }

    async function toggleProvider(id, active) {
        if (!confirm(`Are you sure you want to ${active ? 'activate' : 'deactivate'} this provider?`)) return;
        try {
            if (active) {
                await api('/admin/providers/providers/' + id, { method: 'PUT', body: JSON.stringify({ is_active: true }) });
            } else {
                await api('/admin/providers/providers/' + id, { method: 'PUT', body: JSON.stringify({ is_active: false }) });
            }
            showToast('Provider status updated', 'success');
            await loadProviders();
        } catch {}
    }

    async function deleteProvider(id, name) {
        if (!confirm(`⚠️ DELETE "${name}" permanently?\n\nThis will also remove all package assignments for this provider. This action cannot be undone.`)) return;
        try {
            await api('/admin/providers/providers/' + id, { method: 'DELETE' });
            showToast(`Provider "${name}" deleted`, 'success');
            await loadProviders();
            await loadAssignments();
        } catch (e) {
            showToast('Failed to delete provider: ' + (e.message || 'Unknown error'), 'error');
        }
    }

    // ── Package Assignment CRUD ──────────────────────────

    async function openAssignModal() {
        if (!_packages.length) {
            try { _packages = await api('/admin/packages/'); } catch { _packages = []; }
        }
        if (!_providers.length) {
            try { _providers = await api('/admin/providers/providers'); } catch { _providers = []; }
        }

        const pkgSel = document.getElementById('assignPkgId');
        pkgSel.innerHTML = '<option value="">— Select Package —</option>' +
            _packages.map(p => `<option value="${p.id}">${p.display_name} (${p.name})</option>`).join('');

        const provSel = document.getElementById('assignProvId');
        provSel.innerHTML = '<option value="">— Select Provider —</option>' +
            _providers.filter(p => p.is_active).map(p => `<option value="${p.id}">${p.display_name}</option>`).join('');

        document.getElementById('assignTokens').value = '0';
        openModal('assignModal');
    }

    async function assignProvider(e) {
        e.preventDefault();
        const package_id = parseInt(document.getElementById('assignPkgId').value);
        const provider_id = parseInt(document.getElementById('assignProvId').value);
        const token_quota = parseInt(document.getElementById('assignTokens').value) || 0;

        if (!package_id || !provider_id) {
            showToast('Please select both Package and Provider', 'error');
            return;
        }

        try {
            await api('/admin/providers/package-providers?package_id=' + package_id, {
                method: 'POST',
                body: JSON.stringify({ provider_id, token_quota, is_available: true }),
            });
            showToast('Provider assigned to package', 'success');
            closeModal('assignModal');
            await loadAssignments();
        } catch {}
    }

    function openEditAssignment(id, quota, available) {
        document.getElementById('editAssignId').value = id;
        document.getElementById('editAssignQuota').value = quota || 0;
        document.getElementById('editAssignAvailable').checked = available;
        openModal('editAssignModal');
    }

    async function editAssignment(e) {
        e.preventDefault();
        const id = document.getElementById('editAssignId').value;
        const token_quota = parseInt(document.getElementById('editAssignQuota').value) || 0;
        const is_available = document.getElementById('editAssignAvailable').checked;

        try {
            await api('/admin/providers/package-providers/' + id, {
                method: 'PUT',
                body: JSON.stringify({ token_quota, is_available }),
            });
            showToast('Assignment updated', 'success');
            closeModal('editAssignModal');
            await loadAssignments();
        } catch {}
    }

    async function removeAssignment(id) {
        if (!confirm('Remove this provider from the package?')) return;
        try {
            await api('/admin/providers/package-providers/' + id, { method: 'DELETE' });
            showToast('Assignment removed', 'success');
            await loadAssignments();
        } catch {}
    }

    init();
    </script>
</body>
</html>
