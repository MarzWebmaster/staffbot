<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1780388378">
    <style>
        .detail-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .detail-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #fff; }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .detail-label { color: rgba(255,255,255,0.5); font-size: 13px; }
        .detail-value { color: #fff; font-size: 14px; font-weight: 500; }
        .badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .badge.active { background: rgba(34,197,94,0.15); color: #22c55e; }
        .badge.pending { background: rgba(234,179,8,0.15); color: #eab308; }
        .badge.suspended { background: rgba(239,68,68,0.15); color: #ef4444; }
        .badge.package { background: rgba(99,102,241,0.15); color: #818cf8; }
        .btn-sm { padding: 6px 14px; font-size: 13px; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; }
        .btn-sm:hover { background: rgba(255,255,255,0.1); }
        .btn-primary { background: #3b82f6; border-color: #3b82f6; }
        .btn-danger { background: #ef4444; border-color: #ef4444; }
    </style>
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
        <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:12px">
                    <a href="users.html" class="btn-sm" style="text-decoration:none">← Back to Users</a>
                    <h1 id="pageTitle">User Profile</h1>
                </div>
                <div style="display:flex;gap:8px" id="quickActions"></div>
            </div>

            <div id="loading" style="text-align:center;padding:60px;color:var(--text-light)">Loading user data...</div>
            <div id="content" style="display:none">

                <!-- Profile Card -->
                <div class="detail-card" style="border-left:4px solid #3b82f6">
                    <h3>👤 Profile</h3>
                    <div class="detail-row"><span class="detail-label">Name</span><span class="detail-value" id="d-name">-</span></div>
                    <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value" id="d-email">-</span></div>
                    <div class="detail-row"><span class="detail-label">Company</span><span class="detail-value" id="d-company">-</span></div>
                    <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value" id="d-phone">-</span></div>
                    <div class="detail-row"><span class="detail-label">Registered</span><span class="detail-value" id="d-created">-</span></div>
                    <div class="detail-row"><span class="detail-label">Last Updated</span><span class="detail-value" id="d-updated">-</span></div>
                </div>

                <!-- Status & Package Card -->
                <div class="detail-card" style="border-left:4px solid #8b5cf6">
                    <h3>📋 Status & Package</h3>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value">
                            <span id="d-status-badge"></span>
                            <select id="d-status-select" class="btn-sm" style="margin-left:8px;display:none" onchange="changeStatus()">
                                <option value="active">Active</option>
                                <option value="pending">Pending</option>
                                <option value="suspended">Suspended</option>
                            </select>
                        </span>
                    </div>
                    <div class="detail-row"><span class="detail-label">Package</span><span class="detail-value"><span class="badge package" id="d-package">-</span></span></div>
                    <div class="detail-row"><span class="detail-label">Subdomain</span><span class="detail-value" id="d-subdomain">-</span></div>
                    <div class="detail-row"><span class="detail-label">Container Port</span><span class="detail-value" id="d-port">-</span></div>
                </div>

                <!-- Subscription Card -->
                <div class="detail-card" id="subscriptionCard" style="display:none;border-left:4px solid #22c55e">
                    <h3>💳 Subscription</h3>
                    <div id="subscriptionInfo"></div>
                </div>

                <!-- Containers Card -->
                <div class="detail-card" id="containersCard" style="display:none">
                    <h3>📦 Containers</h3>
                    <div id="containersInfo"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js?v=1779798256"></script>
    <script>
    let currentUser = null;

    async function init() {
        const user = await checkAdminAuth('/admin/login.html');
        if (!user) return;
        renderSidebar('users');
        renderSidebarUser(user);

        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');
        if (!userId) {
            showToast('No user ID provided', 'error');
            return;
        }
        await loadUser(userId);
    }

    async function loadUser(userId) {
        try {
            const u = await api('/admin/users/' + userId);
            currentUser = u;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.getElementById('pageTitle').textContent = u.name || 'User Profile';

            // Profile
            document.getElementById('d-name').textContent = u.name || '-';
            document.getElementById('d-email').textContent = u.email || '-';
            document.getElementById('d-company').textContent = u.company || '-';
            document.getElementById('d-phone').textContent = u.phone || '-';
            document.getElementById('d-created').textContent = formatDate(u.created_at);
            document.getElementById('d-updated').textContent = formatDate(u.updated_at);

            // Status
            const badge = document.getElementById('d-status-badge');
            badge.className = 'badge ' + (u.status || 'pending');
            badge.textContent = (u.status || 'pending').charAt(0).toUpperCase() + (u.status || 'pending').slice(1);

            // Package
            document.getElementById('d-package').textContent = u.package || 'basic';

            // Subdomain & port
            document.getElementById('d-subdomain').textContent = u.subdomain || 'N/A';
            document.getElementById('d-port').textContent = u.container_port || 'N/A';

            // Quick actions
            const actions = document.getElementById('quickActions');
            actions.innerHTML = '<button class="btn-sm" onclick="toggleEditStatus()">✏️ Change Status</button>';
        } catch(e) {
            document.getElementById('loading').innerHTML = '<p style="color:#ef4444">Failed to load user: ' + (e.message || 'Unknown error') + '</p>';
        }
    }

    function formatDate(d) {
        if (!d) return '-';
        try { return new Date(d).toLocaleDateString('en-MY', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch(e) { return d; }
    }

    function toggleEditStatus() {
        const select = document.getElementById('d-status-select');
        const badge = document.getElementById('d-status-badge');
        if (select.style.display === 'none') {
            select.value = currentUser.status;
            select.style.display = 'inline-block';
            badge.style.display = 'none';
        } else {
            select.style.display = 'none';
            badge.style.display = 'inline';
        }
    }

    async function changeStatus() {
        const newStatus = document.getElementById('d-status-select').value;
        try {
            await api('/admin/users/' + currentUser.id, { method: 'PUT', body: JSON.stringify({ status: newStatus }) });
            showToast('Status updated to ' + newStatus, 'success');
            currentUser.status = newStatus;
            const badge = document.getElementById('d-status-badge');
            badge.className = 'badge ' + newStatus;
            badge.textContent = newStatus.charAt(0).toUpperCase() + newStatus.slice(1);
            document.getElementById('d-status-select').style.display = 'none';
            badge.style.display = 'inline';
        } catch(e) {
            showToast(e.message || 'Failed to update status', 'error');
        }
    }

    init();
    </script>
</body>
</html>
