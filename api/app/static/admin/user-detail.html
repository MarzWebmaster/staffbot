<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1780388378">
    <style>
        .detail-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .detail-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #fff; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .detail-label { color: rgba(255,255,255,0.5); font-size: 13px; min-width: 120px; }
        .detail-value { color: #fff; font-size: 14px; font-weight: 500; text-align: right; flex: 1; }
        .detail-input { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; width: 250px; text-align: right; }
        .detail-input:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,0.15); }
        .detail-select { padding: 6px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; width: 250px; }
        .badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .badge.active { background: rgba(34,197,94,0.15); color: #22c55e; }
        .badge.pending { background: rgba(234,179,8,0.15); color: #eab308; }
        .badge.suspended { background: rgba(239,68,68,0.15); color: #ef4444; }
        .badge.package { background: rgba(99,102,241,0.15); color: #818cf8; }
        .btn { padding: 8px 18px; font-size: 13px; border-radius: 8px; cursor: pointer; border: none; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #fff; }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-success:hover { background: #16a34a; }
        .btn-warning { background: #f59e0b; color: #000; }
        .btn-warning:hover { background: #d97706; }
        .action-bar { display: flex; gap: 8px; flex-wrap: wrap; }
        .field-hint { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 2px; }
    </style>
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
        <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:12px">
                    <a href="users.html" class="btn btn-ghost">← Back to Users</a>
                    <h1 id="pageTitle">User Profile</h1>
                </div>
                <div class="action-bar" id="actionBar"></div>
            </div>

            <div id="loading" style="text-align:center;padding:60px;color:var(--text-light)">Loading...</div>
            <div id="content" style="display:none">

                <!-- Profile Card -->
                <div class="detail-card" style="border-left:4px solid #3b82f6">
                    <h3>👤 Profile</h3>
                    <div class="detail-row">
                        <span class="detail-label">Name</span>
                        <span class="detail-value" id="v-name">-</span>
                        <input type="text" class="detail-input" id="e-name" style="display:none" placeholder="Full name">
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Email</span>
                        <span class="detail-value" id="v-email">-</span>
                        <input type="email" class="detail-input" id="e-email" style="display:none" placeholder="email@example.com">
                    </div>
                    <div class="detail-row" id="passwordRow" style="display:none">
                        <span class="detail-label">Password</span>
                        <input type="password" class="detail-input" id="e-password" placeholder="New password (leave blank to keep)">
                        <span class="field-hint" style="margin-left:8px">Leave blank to keep current</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Company</span>
                        <span class="detail-value" id="v-company">-</span>
                        <input type="text" class="detail-input" id="e-company" style="display:none" placeholder="Company name">
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Phone</span>
                        <span class="detail-value" id="v-phone">-</span>
                        <input type="text" class="detail-input" id="e-phone" style="display:none" placeholder="+60...">
                    </div>
                </div>

                <!-- Status & Package Card -->
                <div class="detail-card" style="border-left:4px solid #8b5cf6">
                    <h3>📋 Status & Package</h3>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value"><span id="v-status-badge" class="badge">-</span></span>
                        <select class="detail-select" id="e-status" style="display:none">
                            <option value="active">Active</option>
                            <option value="pending">Pending</option>
                            <option value="suspended">Suspended</option>
                        </select>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Package</span>
                        <span class="detail-value"><span class="badge package" id="v-package">-</span></span>
                        <select class="detail-select" id="e-package" style="display:none"></select>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Subdomain</span>
                        <span class="detail-value" id="v-subdomain">N/A</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Registered</span>
                        <span class="detail-value" id="v-created">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Last Updated</span>
                        <span class="detail-value" id="v-updated">-</span>
                    </div>
                </div>

                <!-- Containers Card -->
                <div class="detail-card" id="containersCard" style="border-left:4px solid #06b6d4">
                    <h3>📦 Containers</h3>
                    <div id="containersInfo"><span style="color:rgba(255,255,255,0.3);font-size:13px">No containers deployed</span></div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js?v=1780480000"></script>
    <script>
    let currentUser = null;
    let mode = 'view'; // 'view' | 'edit' | 'new'
    let packageList = [];

    function $(id) { return document.getElementById(id); }

    async function init() {
        const user = await checkAdminAuth('/admin/login.html');
        if (!user) return;
        renderSidebar('users');
        renderSidebarUser(user);

        await loadPackages();

        const params = new URLSearchParams(window.location.search);
        const userId = params.get('id');
        const editMode = params.get('edit');
        const action = params.get('action');

        if (action === 'new') {
            mode = 'new';
            setupNewMode();
            return;
        }

        if (!userId) {
            showToast('No user ID provided', 'error');
            return;
        }

        mode = editMode === '1' ? 'edit' : 'view';
        await loadUser(userId);
    }

    async function loadPackages() {
        try {
            const pkgs = await api('/admin/packages/all');
            packageList = pkgs.filter(p => p.is_active);
        } catch(e) {
            // Fallback — try public endpoint
            try {
                packageList = await api('/packages/public');
            } catch(e2) {
                console.log('Failed to load packages');
                packageList = [];
            }
        }
    }

    function populatePackageSelect(currentPkg) {
        const sel = $('e-package');
        sel.innerHTML = packageList.map(p => 
            '<option value="' + p.name + '"' + (p.name === currentPkg ? ' selected' : '') + '>' +
            (p.display_name || p.name) + ' — RM' + (p.price_monthly || 0) + '/mo' +
            '</option>'
        ).join('');
        if (!packageList.length) {
            sel.innerHTML = '<option value="basic">Basic</option>';
        }
    }

    async function loadUser(userId) {
        try {
            const u = await api('/admin/users/' + userId);
            currentUser = u;
            $('loading').style.display = 'none';
            $('content').style.display = 'block';
            populateFields();
            await loadUserSubdomains(userId);
            await loadUserContainers(userId);
            applyMode();
        } catch(e) {
            $('loading').innerHTML = '<p style="color:#ef4444">Failed to load user: ' + (e.message || 'Unknown error') + '</p>';
        }
    }

    async function loadUserSubdomains(userId) {
        try {
            const all = await api('/admin/subdomains');
            const userSubs = all.filter(s => s.client_id === parseInt(userId));
            if (userSubs.length > 0) {
                const sub = userSubs[0];
                $('v-subdomain').textContent = sub.subdomain;
            }
        } catch(e) { console.log('Subdomain fetch skipped'); }
    }

    async function loadUserContainers(userId) {
        try {
            const containers = await api('/admin/users/containers/list?client_id=' + userId);
            if (containers.length > 0) {
                $('containersInfo').innerHTML = containers.map(c => {
                    const statusColors = { running: '#22c55e', pending: '#eab308', stopped: '#ef4444', error: '#ef4444' };
                    const color = statusColors[c.status] || '#9ca3af';
                    return '<div class="detail-row">' +
                        '<span class="detail-label">' + (c.name || c.container_name || 'Container #' + c.id) + '</span>' +
                        '<span class="detail-value">' +
                            '<span style="color:' + color + ';font-size:12px">● ' + (c.status || 'unknown') + '</span>' +
                            (c.port ? ' <span style="font-size:11px;color:rgba(255,255,255,0.3)">:' + c.port + '</span>' : '') +
                        '</span>' +
                    '</div>';
                }).join('');
            }
        } catch(e) { console.log('Container fetch skipped'); }
    }

    function populateFields() {
        const u = currentUser;
        $('pageTitle').textContent = u.name || 'User Profile';
        $('v-name').textContent = u.name || '-';
        $('v-email').textContent = u.email || '-';
        $('v-company').textContent = u.company || '-';
        $('v-phone').textContent = u.phone || '-';
        $('v-created').textContent = formatDate(u.created_at);
        $('v-updated').textContent = formatDate(u.updated_at);
        $('v-package').textContent = u.package || 'basic';

        const badge = $('v-status-badge');
        badge.className = 'badge ' + (u.status || 'pending');
        badge.textContent = (u.status || 'pending').charAt(0).toUpperCase() + (u.status || 'pending').slice(1);

        // Pre-fill edit fields
        $('e-name').value = u.name || '';
        $('e-email').value = u.email || '';
        $('e-company').value = u.company || '';
        $('e-phone').value = u.phone || '';
        populatePackageSelect(u.package || 'basic');
        $('e-status').value = u.status || 'active';
        $('e-password').value = '';
    }

    function applyMode() {
        const isEdit = mode === 'edit';
        const isView = mode === 'view';

        // Toggle value spans vs input fields
        ['name','email','company','phone'].forEach(f => {
            $('v-' + f).style.display = isView ? '' : 'none';
            $('e-' + f).style.display = isEdit ? '' : 'none';
        });
        $('v-package').style.display = isView ? '' : 'none';
        $('e-package').style.display = isEdit ? '' : 'none';
        $('v-status-badge').style.display = isView ? '' : 'none';
        $('e-status').style.display = isEdit ? '' : 'none';
        $('passwordRow').style.display = isEdit ? 'flex' : 'none';

        // Action bar
        const bar = $('actionBar');
        if (isView) {
            $('pageTitle').textContent = currentUser.name || 'User Profile';
            const subdomain = currentUser.subdomain || '';
            const hasContainer = subdomain && currentUser.container_port;
            bar.innerHTML = '<a href="?id=' + currentUser.id + '&edit=1" class="btn btn-warning">✏️ Edit</a>' +
                '<button onclick="deleteUser()" class="btn btn-danger">🗑️ Delete</button>' +
                (!hasContainer
                    ? '<button onclick="deployUser()" class="btn btn-success" style="background:#06b6d4">🚀 Deploy</button>'
                    : '<span style="color:rgba(255,255,255,0.3);font-size:12px;margin-left:8px">✓ Deployed</span>');
        } else {
            $('pageTitle').textContent = 'Edit: ' + (currentUser.name || currentUser.email || 'User');
            bar.innerHTML = '<button onclick="saveUser()" class="btn btn-success">💾 Save Changes</button>' +
                '<a href="?id=' + currentUser.id + '" class="btn btn-ghost">❌ Cancel</a>';
        }
    }

    function setupNewMode() {
        $('loading').style.display = 'none';
        $('content').style.display = 'block';
        $('pageTitle').textContent = '➕ New User';

        // Show all edit fields, hide view spans
        ['name','email','company','phone'].forEach(f => {
            $('v-' + f).style.display = 'none';
            $('e-' + f).style.display = '';
            $('e-' + f).value = '';
        });
        $('v-package').style.display = 'none';
        $('e-package').style.display = '';
        populatePackageSelect('basic');
        $('v-status-badge').style.display = 'none';
        $('e-status').style.display = '';
        $('e-status').value = 'active';
        $('passwordRow').style.display = 'flex';
        $('e-password').value = '';
        $('e-password').placeholder = 'Password (required)';

        // Clear read-only fields
        $('v-subdomain').textContent = '—';
        $('v-port').textContent = '—';
        $('v-created').textContent = '—';
        $('v-updated').textContent = '—';

        $('actionBar').innerHTML = '<button onclick="createUser()" class="btn btn-success">➕ Create User</button>' +
            '<a href="users.html" class="btn btn-ghost">❌ Cancel</a>';
    }

    async function saveUser() {
        const body = {
            name: $('e-name').value.trim(),
            email: $('e-email').value.trim(),
            company: $('e-company').value.trim(),
            phone: $('e-phone').value.trim(),
            status: $('e-status').value,
            package: $('e-package').value,
        };
        const pwd = $('e-password').value;
        if (pwd) body.password = pwd;

        try {
            await api('/admin/users/' + currentUser.id, { method: 'PUT', body: JSON.stringify(body) });
            showToast('User updated!', 'success');
            // Reload in view mode
            window.location.href = 'user-detail.html?id=' + currentUser.id;
        } catch(e) { showToast(e.message || 'Failed to save', 'error'); }
    }

    async function createUser() {
        const name = $('e-name').value.trim();
        const email = $('e-email').value.trim();
        const password = $('e-password').value;
        if (!name || !email) { showToast('Name and email are required', 'error'); return; }
        if (!password || password.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }

        const body = {
            name, email, password,
            company: $('e-company').value.trim(),
            phone: $('e-phone').value.trim(),
            status: $('e-status').value,
            package: $('e-package').value,
        };

        try {
            const result = await api('/admin/users', { method: 'POST', body: JSON.stringify(body) });
            showToast('User created!', 'success');
            window.location.href = 'user-detail.html?id=' + result.id;
        } catch(e) { showToast(e.message || 'Failed to create', 'error'); }
    }

    async function deleteUser() {
        if (!currentUser) return;
        if (!confirm('Delete user "' + (currentUser.name || currentUser.email) + '"? This is permanent.')) return;
        try {
            await api('/admin/users/' + currentUser.id, { method: 'DELETE' });
            showToast('User deleted', 'success');
            window.location.href = 'users.html';
        } catch(e) { showToast(e.message || 'Failed to delete', 'error'); }
    }

    async function deployUser() {
        if (!currentUser) return;
        if (!confirm('Deploy container + bind subdomain for "' + (currentUser.name || currentUser.email) + '"?\n\nThis will create a Docker container, assign a port, and bind the subdomain.')) return;

        const btn = event.target;
        btn.disabled = true;
        btn.textContent = '⏳ Deploying...';
        showToast('Deploying... this takes ~30 seconds', 'info');

        try {
            const result = await api('/admin/users/' + currentUser.id + '/deploy', { method: 'POST' });
            showToast('Deployed! ' + (result.verification && result.verification.summary || ''), 'success');
            // Reload to show updated state
            setTimeout(() => window.location.reload(), 2000);
        } catch(e) {
            showToast(e.message || 'Deployment failed', 'error');
            btn.disabled = false;
            btn.textContent = '🚀 Deploy';
        }
    }

    function formatDate(d) {
        if (!d) return '-';
        try { return new Date(d).toLocaleDateString('en-MY', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch(e) { return d; }
    }

    init();
    </script>
</body>
</html>
