<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — StaffBot.my</title><style>
@media (max-width: 768px) {
    html, body { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
    .app-layout { display: block !important; width: 100% !important; max-width: 100% !important; margin: 0 !important; }
    .main-content { margin: 0 !important; margin-left: 0 !important; width: 100vw !important; max-width: 100vw !important; padding: 12px !important; padding-top: 56px !important; box-sizing: border-box !important; flex: none !important; float: none !important; display: block !important; }
    .sidebar-toggle { display: flex !important; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; }
    .sidebar-overlay.active { display: block; }
    .sidebar { transform: translateX(-100%) !important; transition: transform 0.3s ease !important; }
    .sidebar.open { transform: translateX(0) !important;  }
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr !important; gap: 12px !important; }
    #adminStats.grid-4, #affiliateStats.grid-4, #billingStats.grid-4 { grid-template-columns: 1fr 1fr !important; gap: 12px !important; }
    .mobile-grid-2 { grid-template-columns: 1fr !important; max-width: 100% !important; }
    .mobile-grid-3 { grid-template-columns: 1fr !important; max-width: 100% !important; }
    .card { padding: 14px !important; max-width: 100% !important; overflow-wrap: break-word !important; }
    .stat-card .stat-value { font-size: 22px !important; }
    .table-container { overflow-x: auto !important; max-width: 100% !important; }
    .table-container table { min-width: 100% !important; }
    .modal { width: 95vw !important; max-width: 95vw !important; }
    .btn { padding: 12px 20px !important; min-height: 44px !important; }
}
@media (max-width: 480px) {
    #adminStats.grid-4, #affiliateStats.grid-4, #billingStats.grid-4 { grid-template-columns: 1fr !important; }
    .modal { width: 100vw !important; max-width: 100vw !important; border-radius: 0 !important; }
}
</style><script>
function toggleSidebar() {
    var s = document.querySelector('.sidebar');
    var o = document.querySelector('.sidebar-overlay');
    if (!s) return;
    if (s.classList.contains('open')) {
        s.classList.remove('open');
        if (o) o.classList.remove('active');
    } else {
        s.classList.add('open');
        if (o) o.classList.add('active');
    }
}
</script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=200">
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
        <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar"><h1>Dashboard</h1></div>

            <!-- Stats Cards -->
            <div class="grid-4" id="adminStats">
                <div class="card stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="stat-users">-</div></div>
                <div class="card stat-card"><div class="stat-label">Active</div><div class="stat-value" id="stat-active">-</div></div>
                <div class="card stat-card"><div class="stat-label">Active Containers</div><div class="stat-value" id="stat-containers">-</div></div>
                <div class="card stat-card"><div class="stat-label">Pending Deploy</div><div class="stat-value" id="stat-pending">-</div></div>
            </div>

            <!-- Token Usage + Revenue Chart -->
            <div class="mobile-grid-2" style="display:grid;grid-template-columns:2fr 1fr;gap:20px">
                <div class="card">
                    <div class="card-header"><h3>Token Usage (30 days)</h3></div>
                    <div style="height:250px"><canvas id="tokenChart"></canvas></div>
                    <div class="mobile-grid-3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px">
                        <div class="card" style="padding:12px;text-align:center">
                            <div style="font-size:11px;color:var(--text-light)">Total Tokens</div>
                            <div style="font-size:20px;font-weight:700" id="totalTokens">0</div>
                        </div>
                        <div class="card" style="padding:12px;text-align:center">
                            <div style="font-size:11px;color:var(--text-light)">Total Requests</div>
                            <div style="font-size:20px;font-weight:700" id="totalRequests">0</div>
                        </div>
                        <div class="card" style="padding:12px;text-align:center">
                            <div style="font-size:11px;color:var(--text-light)">Total Cost</div>
                            <div style="font-size:20px;font-weight:700" id="totalCost">RM0.00</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Revenue</h3></div>
                    <div style="height:200px"><canvas id="revenueChart"></canvas></div>
                    <div style="text-align:center;margin-top:12px">
                        <div style="font-size:11px;color:var(--text-light)">Total Revenue</div>
                        <div style="font-size:24px;font-weight:700" id="totalRevenue">RM0.00</div>
                    </div>
                </div>
            </div>

            <!-- Users Table with Pagination -->
            <div class="card" style="margin-top:20px">
                <div class="card-header"><h3>Registered Users</h3><span style="font-size:13px;color:var(--text-light)" id="userCount"></span></div>
                <table class="data-table">
                    <thead><tr><th>Name</th><th>Email</th><th>Package</th><th>Status</th><th>Registered</th></tr></thead>
                    <tbody id="usersBody"></tbody>
                </table>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
                    <span style="font-size:13px;color:var(--text-light)" id="paginationInfo"></span>
                    <div style="display:flex;gap:4px" id="paginationControls"></div>
                </div>
            </div>

            <!-- System Health -->
            <div class="card" id="systemHealthCard" style="margin-top:20px">
                <div class="card-header"><h3>System Health</h3></div>
                <div id="systemHealth"><p style="color:var(--text-light)">Loading...</p></div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script>
    let tokenChartInstance = null;
    let revenueChartInstance = null;
    let allUsers = [];
    let pageSize = 5;
    let currentPage = 1;

    function renderUsersPage() {
        const totalPages = Math.ceil(allUsers.length / pageSize) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const page = allUsers.slice(start, end);

        const tbody = document.getElementById('usersBody');
        tbody.innerHTML = page.map(u => '<tr>' +
            '<td>' + (u.name || '-') + '</td>' +
            '<td>' + u.email + '</td>' +
            '<td><span style="background:rgba(99,102,241,0.15);color:#818CF8;padding:2px 8px;border-radius:12px;font-size:12px">' + (u.package || '-') + '</span></td>' +
            '<td>' + statusBadge(u.status) + '</td>' +
            '<td style="font-size:13px;color:var(--text-light)">' + (u.created_at ? u.created_at.slice(0,10) : '-') + '</td>' +
            '</tr>').join('');

        document.getElementById('paginationInfo').textContent =
            'Showing ' + (start + 1) + '-' + Math.min(end, allUsers.length) + ' of ' + allUsers.length;

        const controls = document.getElementById('paginationControls');
        let html = '';
        html += '<button class="btn btn-sm btn-outline" onclick="currentPage=1;renderUsersPage()" ' + (currentPage === 1 ? 'disabled' : '') + '>❮❮</button>';
        html += '<button class="btn btn-sm btn-outline" onclick="currentPage--;renderUsersPage()" ' + (currentPage <= 1 ? 'disabled' : '') + '>❮</button>';

        // Page number buttons
        const maxBtns = 5;
        let pStart = Math.max(1, currentPage - Math.floor(maxBtns/2));
        let pEnd = Math.min(totalPages, pStart + maxBtns - 1);
        if (pEnd - pStart + 1 < maxBtns) pStart = Math.max(1, pEnd - maxBtns + 1);
        for (let p = pStart; p <= pEnd; p++) {
            html += '<button class="btn btn-sm ' + (p === currentPage ? 'btn-primary' : 'btn-outline') + '" onclick="currentPage=' + p + ';renderUsersPage()">' + p + '</button>';
        }

        html += '<button class="btn btn-sm btn-outline" onclick="currentPage++;renderUsersPage()" ' + (currentPage >= totalPages ? 'disabled' : '') + '>❯</button>';
        html += '<button class="btn btn-sm btn-outline" onclick="currentPage=' + totalPages + ';renderUsersPage()" ' + (currentPage === totalPages ? 'disabled' : '') + '>❯❯</button>';
        controls.innerHTML = html;
    }

    async function init() {
        const user = await checkAuth('/admin/login.html');
        if (!user) return;
        renderSidebarUser(user);
        renderSidebar('dashboard');

        // Stats
        try {
            const stats = await api('/admin/dashboard');
            document.getElementById('stat-users').textContent = stats.total_users;
            document.getElementById('stat-active').textContent = stats.active_users;
            document.getElementById('stat-containers').textContent = stats.active_containers;
            document.getElementById('stat-pending').textContent = stats.pending_deployments;
            document.getElementById('totalRevenue').textContent = 'RM' + Number(stats.total_revenue || 0).toFixed(2);

            if (stats.monthly_revenue && stats.monthly_revenue.length) {
                const labels = stats.monthly_revenue.map(r => r.month);
                const amounts = stats.monthly_revenue.map(r => r.amount);
                const ctx2 = document.getElementById('revenueChart').getContext('2d');
                if (revenueChartInstance) revenueChartInstance.destroy();
                revenueChartInstance = new Chart(ctx2, {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'Revenue', data: amounts, backgroundColor: '#10B981', borderRadius: 4 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                                 x: { grid: { display: false } } } }
                });
            }
        } catch {}

        // Token Usage
        try {
            const usage = await api('/admin/dashboard/token-usage');
            document.getElementById('totalTokens').textContent = (usage.summary?.total_tokens || 0).toLocaleString();
            document.getElementById('totalRequests').textContent = (usage.summary?.total_requests || 0).toLocaleString();
            const cost = usage.summary?.total_cost || 0;
            document.getElementById('totalCost').textContent = 'RM' + Number(cost).toFixed(2);

            if (usage.timeseries && usage.timeseries.length) {
                const labels = usage.timeseries.map(t => t.date || t.day || t.period);
                const tokens = usage.timeseries.map(t => t.tokens || t.total_tokens || t.count || 0);
                const ctx = document.getElementById('tokenChart').getContext('2d');
                if (tokenChartInstance) tokenChartInstance.destroy();
                tokenChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels, datasets: [{ label: 'Tokens', data: tokens, borderColor: '#6366F1', backgroundColor: 'rgba(99,102,241,0.1)', fill: true, tension: 0.4 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                                 x: { grid: { display: false } } } }
                });
            } else {
                document.getElementById('tokenChart').parentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:250px;color:var(--text-light)">No token usage data yet</div>';
            }
        } catch {}

        // All Users with Pagination
        try {
            const users = await api('/admin/users/');
            allUsers = users.items || [];
            document.getElementById('userCount').textContent = '(' + allUsers.length + ' total)';
            currentPage = 1;
            renderUsersPage();
        } catch {}

        // System Health
        try {
            const health = await api('/admin/health');
            document.getElementById('systemHealth').innerHTML =
                '<div class="mobile-grid-3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">' +
                ['API','Database','Server B'].map((name, i) => {
                    const key = ['api_status','db_status','server_b_status'][i];
                    const s = health[key] || 'unknown';
                    return '<div style="padding:16px;border:1px solid var(--border);border-radius:8px;text-align:center">' +
                        '<div style="font-size:13px;color:var(--text-light);margin-bottom:8px">' + name + '</div>' +
                        '<span class="status-badge status-' + (s === 'ok' ? 'active' : s === 'unreachable' || !s ? 'error' : 'pending') + '">' +
                        '<span class="status-dot dot-' + (s === 'ok' ? 'active' : s === 'unreachable' || !s ? 'error' : 'pending') + '"></span>' + s +
                        '</span></div>';
                }).join('') + '</div>';
        } catch {}
    }
    init();
    </script>
</body>
</html>
