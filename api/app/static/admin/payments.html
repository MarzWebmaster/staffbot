<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1780497829">
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout" id="app">
        <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar"><h1>💳 Payment Gateway</h1></div>

            <!-- Stripe Status -->
            <div class="card admin-card admin-card-indigo" id="stripeStatusCard" style="border-radius:12px;margin-bottom:16px">
                <div class="card-header"><h3>🔌 Stripe Connection</h3></div>
                <div id="stripeStatus"><p style="color:var(--text-light)">Checking...</p></div>
            </div>

            <!-- Stripe Keys Configuration -->
            <div class="card admin-card admin-card-blue" style="border-radius:12px;margin-top:16px">
                <div class="card-header"><h3>🔑 Stripe Keys</h3></div>
                <form onsubmit="return saveStripeKeys(event)">
                    <div class="grid-2">
                        <div class="form-group"><label>Secret Key</label><input type="password" class="form-input" id="stripe_key" placeholder="sk_live_..."></div>
                        <div class="form-group"><label>Webhook Secret</label><input type="password" class="form-input" id="stripe_wh" placeholder="whsec_..."></div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="saveStripeBtn">Save Stripe Keys</button>
                </form>
            </div>

            <!-- Recent Transactions -->
            <div class="card admin-card admin-card-green" style="border-radius:12px;margin-top:16px">
                <div class="card-header"><h3>📄 Recent Transactions</h3></div>
                <div id="transactionList"><p style="color:var(--text-light);padding:16px">No transactions yet.</p></div>
            </div>

            <!-- Quick Actions -->
            <div class="card admin-card admin-card-amber" style="border-radius:12px;margin-top:16px">
                <div class="card-header"><h3>⚡ Quick Actions</h3></div>
                <div style="display:flex;gap:12px;flex-wrap:wrap">
                    <a href="https://dashboard.stripe.com/" target="_blank" class="btn btn-outline">📊 Stripe Dashboard</a>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js?v=1780480000"></script>
    <script>
    const STRIPE_KEYS = {
        stripe_key: {key: 'stripe_secret_key', encrypted: true},
        stripe_wh: {key: 'stripe_webhook_secret', encrypted: true},
    };

    async function loadStripeKeys() {
        try {
            const s = await api('/admin/settings/');
            s.forEach(setting => {
                const inputId = Object.keys(STRIPE_KEYS).find(k => STRIPE_KEYS[k].key === setting.key);
                if (inputId && document.getElementById(inputId)) {
                    document.getElementById(inputId).value = setting.value || '';
                }
            });
        } catch {}
    }

    async function saveStripeKeys(e) {
        e.preventDefault();
        const btn = document.getElementById('saveStripeBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
            for (const [inputId, cfg] of Object.entries(STRIPE_KEYS)) {
                const val = document.getElementById(inputId).value.trim();
                if (val) {
                    await api('/admin/settings/', { method: 'PUT', body: JSON.stringify({
                        key: cfg.key,
                        value: val,
                        encrypted: cfg.encrypted,
                    })});
                }
            }
            showToast('Stripe keys saved', 'success');
            // Refresh status
            const status = await api('/admin/payments/status');
            const card = document.getElementById('stripeStatus');
            if (status.connected) {
                card.innerHTML = `
                    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
                        <span class="status-badge status-active">✅ Connected</span>
                        <span style="font-size:13px;color:var(--text-light)">Account: ${status.account_name || 'N/A'}</span>
                        <span style="font-size:13px;color:var(--text-light)">Mode: ${status.livemode ? '🔴 Live' : '🟡 Test'}</span>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    <div style="display:flex;align-items:center;gap:12px">
                        <span class="status-badge status-error">❌ Not Connected</span>
                        <span style="font-size:13px;color:var(--text-light)">${status.detail || 'Not connected'}</span>
                    </div>
                `;
            }
        } catch {}
        btn.disabled = false;
        btn.textContent = 'Save Stripe Keys';
        return false;
    }

    async function init() {
        const user = await checkAdminAuth('/admin/login.html');
        if (!user) return;
        renderSidebar('payments');
        renderSidebarUser(user);

        await loadStripeKeys();

        // Check Stripe status
        try {
            const status = await api('/admin/payments/status');
            const card = document.getElementById('stripeStatus');
            if (status.connected) {
                card.innerHTML = `
                    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
                        <span class="status-badge status-active">✅ Connected</span>
                        <span style="font-size:13px;color:var(--text-light)">Account: ${status.account_name || 'N/A'}</span>
                        <span style="font-size:13px;color:var(--text-light)">Mode: ${status.livemode ? '🔴 Live' : '🟡 Test'}</span>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    <div style="display:flex;align-items:center;gap:12px">
                        <span class="status-badge status-error">❌ Not Connected</span>
                        <span style="font-size:13px;color:var(--text-light)">${status.detail || 'Set Stripe keys below'}</span>
                    </div>
                `;
            }
        } catch {
            document.getElementById('stripeStatus').innerHTML = '<span class="status-badge status-error">❌ Error checking status</span>';
        }

        // Load transactions
        try {
            const tx = await api('/admin/payments/transactions');
            const list = document.getElementById('transactionList');
            if (tx.items && tx.items.length > 0) {
                list.innerHTML = `<div class="table-container"><table>
                    <tr><th>Amount</th><th>Client</th><th>Status</th><th>Date</th></tr>
                    ${tx.items.map(t => `<tr>
                        <td><strong>${formatCurrency(t.amount)}</strong></td>
                        <td>${t.client_name || '-'}</td>
                        <td>${statusBadge(t.status)}</td>
                        <td style="font-size:12px">${formatDate(t.created_at)}</td>
                    </tr>`).join('')}
                </table></div>`;
            }
        } catch {}
    }
    init();    </script>
</body>
</html>
