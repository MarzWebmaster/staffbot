<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payout Requests — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css?v=1780388378">
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
        <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <h1>💰 Payout Requests</h1>
            </div>

            <div class="grid-2" id="payoutStats" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px">
                <div class="card stat-card admin-stat admin-stat-amber"><div class="stat-label">⏳ Pending Payouts</div><div class="stat-value" id="stat-payouts">-</div></div>
                <div class="card stat-card admin-stat admin-stat-green"><div class="stat-label">💵 Total Paid</div><div class="stat-value" id="stat-paid">-</div></div>
            </div>

            <div class="card admin-card admin-card-green" style="border-radius:12px">
                <div class="card-header"><h3>💰 Payout Requests</h3></div>
                <div style="overflow-x:auto">
                    <table class="data-table" id="payoutsTable">
                        <thead><tr><th>Affiliate ID</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th><th>Tindakan</th></tr></thead>
                        <tbody id="payoutsBody"><tr><td colspan="6" style="text-align:center;color:var(--text-light)">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>

            <!-- Process Payout Modal -->
            <div class="modal-overlay" id="processPayoutModal">
                <div class="modal">
                    <div class="modal-header"><h3>Process Payout</h3><button class="modal-close" onclick="closeModal('processPayoutModal')">&times;</button></div>
                    <form onsubmit="processPayout(event)">
                        <div class="modal-body">
                            <input type="hidden" id="payoutId">
                            <div class="form-group"><label>Payout Amount</label><div id="payoutAmount" style="font-weight:700;font-size:18px">-</div></div>
                            <div class="form-group"><label>Action</label><select id="payoutAction" class="form-control"><option value="completed">✅ Approve & Pay</option><option value="rejected">❌ Reject</option></select></div>
                            <div class="form-group"><label>Admin Notes</label><textarea id="payoutNotes" class="form-control" rows="2"></textarea></div>
                        </div>
                        <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="closeModal('processPayoutModal')">Batal</button><button type="submit" class="btn btn-primary">Proses</button></div>
                    </form>
                </div>
            </div>
    <script>
    async function init() {
        const user = await checkAdminAuth('/admin/login.html');
        if (!user) return;
        renderSidebar('affiliates');
        renderSidebarUser(user);
        await loadStats();
        await loadPayouts();
    }

    async function loadStats() {
        try {
            const s = await api('/admin/affiliates/stats/summary');
            document.getElementById('stat-paid').textContent = 'RM' + (s.total_paid || 0).toFixed(2);
            document.getElementById('stat-payouts').textContent = s.pending_payout_requests;
        } catch {}
    }

    async function loadPayouts() {
        try {
            const payouts = await api('/admin/affiliates/payouts/all');
            const tbody = document.getElementById('payoutsBody');
            if (!payouts.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-light)">Tiada payout request.</td></tr>';
                return;
            }
            tbody.innerHTML = payouts.map(p => `
                <tr>
                    <td>#${p.id}</td>
                    <td><strong>RM${(p.amount||0).toFixed(2)}</strong></td>
                    <td>${p.method}</td>
                    <td>${statusBadge(p.status)}</td>
                    <td>${formatDate(p.created_at)}</td>
                    <td>${p.status === 'pending' ? `<button class="btn btn-sm btn-primary" onclick="openProcessPayout(${p.id}, ${p.amount})">Proses</button>` : '-'}</td>
                </tr>
            `).join('');
        } catch {}
    }

    function openProcessPayout(id, amount) {
        document.getElementById('payoutId').value = id;
        document.getElementById('payoutAmount').textContent = 'RM' + (amount||0).toFixed(2);
        document.getElementById('payoutAction').value = 'completed';
        document.getElementById('payoutNotes').value = '';
        openModal('processPayoutModal');
    }

    async function processPayout(e) {
        e.preventDefault();
        const id = document.getElementById('payoutId').value;
        const action = document.getElementById('payoutAction').value;
        const notes = document.getElementById('payoutNotes').value;
        try {
            await api('/admin/affiliates/payouts/' + id, {
                method: 'PUT',
                body: JSON.stringify({ status: action, admin_notes: notes }),
            });
            showToast('Payout ' + (action === 'completed' ? 'approved' : 'rejected'), 'success');
            closeModal('processPayoutModal');
            await loadPayouts();
            await loadStats();
        } catch {}
    }
    </script>    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js?v=1780480000"></script>
    <script>
    init();
    </script>
</body>
</html>
