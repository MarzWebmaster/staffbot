<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — StaffBot.my</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="app-layout">
        
        <div class="sidebar" style="background:#111827">
            <div class="sidebar-brand"><h2>StaffBot.my</h2><span>Admin Panel</span></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" ><span>📊</span><span>Dashboard</span></a>
                <a href="my-staff-ai.html" ><span>🤖</span><span>My Staff AI</span></a>
                <a href="chat.html"  class="active"><span>💬</span><span>Chat</span></a>
                <a href="billing.html" ><span>💰</span><span>Billing</span></a>
                <a href="usage.html" ><span>📈</span><span>Usage</span></a>
                <a href="settings.html" ><span>⚙️</span><span>Settings</span></a>
                <a href="affiliates.html" ><span>🤝</span><span>Affiliates</span></a>
                <a href="#" onclick="logout()" style="margin-top:20px;border-top:1px solid rgba(255,255,255,0.1);padding-top:20px"><span>🚪</span><span>Logout</span></a>
            </nav>
            <div id="sidebar-user" style="padding:16px 20px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto"></div>
        </div>
        <div class="main-content">
            <div class="topbar"><h1>💬 Chat</h1></div>
            <div class="card">
                <div style="padding:24px;text-align:center;color:var(--text-light)">
                    <p style="font-size:40px;margin-bottom:16px">💬</p>
                    <h3>Chat with AI Staff</h3>
                    <p style="margin-top:8px;font-size:14px">Select an AI employee from My Staff AI to start chatting.</p>
                    <p style="margin-top:4px;font-size:13px">Or wait for WhatsApp agents to handle customer inquiries automatically.</p>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script>
    async function init() {
        const user = await checkAdminAuth('/admin/login.html');
        if (!user) return;
        renderSidebarUser(user);
    }
    init();
    </script>
</body>
</html>
