# StaffBot.my API Backend — Nginx Reverse Proxy Config
# Place in: /etc/nginx/sites-available/api.staffbot.my
# Then: ln -s /etc/nginx/sites-available/api.staffbot.my /etc/nginx/sites-enabled/
# Then: certbot --nginx -d api.staffbot.my

server {
    listen 80;
    server_name api.staffbot.my staffbot.my;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;

        # WebSocket support for dashboard chat
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

