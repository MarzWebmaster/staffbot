services:
  db:
    image: postgres:16-alpine
    container_name: staffbot-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=staffbot
      - POSTGRES_PASSWORD=DB_PASS_REDACTED
      - POSTGRES_DB=staffbot_db
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffbot -d staffbot_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - staffbot-network

  api:
    build: ./api
    container_name: staffbot-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - STAFFBOT_DATABASE_URL=postgresql://staffbot:DB_PASS_REDACTED@db:5432/staffbot_db
      - STAFFBOT_CORS_ORIGINS=["https://staffbot.my","https://api.staffbot.my","https://admin.staffbot.my","http://localhost:3000","http://localhost:8000"]
      - STAFFBOT_DOMAIN=staffbot.my
      - STAFFBOT_LANDING_PAGE_URL=https://staffbot.my
      - STAFFBOT_ADMIN_EMAIL=admin@staffbot.my
      - STAFFBOT_CORE_IMAGE=staffbot-core:latest
      - STAFFBOT_SERVER_B_API_URL=http://staffbot-gateway:8080
      - STAFFBOT_SERVER_B_API_KEY=SERVER_B_API_KEY_REDACTED
      - HERMES_GATEWAY_URL=http://staffbot-gateway:8642
      - HERMES_API_KEY=sk-hermes-gateway-2026-secure
      - MIMO_API_KEY=sk-jemaah-mimo-key-2024-prod
      - MIMO_BASE_URL=https://jemaahapi.tail5cfbb9.ts.net/v1
      - STAFFBOT_SECRET_KEY=SECRET_KEY_REDACTED
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/staffbot/containers:/root/staffbot/containers
      - /root/staffbot/api/app/static:/app/app/static
      - /etc/nginx/ssl:/etc/nginx/ssl
      - /root/staffbot/profiles:/app/data/profiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - staffbot-network

  gateway:
    image: staffbot-gateway:latest
    container_name: staffbot-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - AUTH_KEY=AUTH_KEY_REDACTED
      - DATABASE_URL=postgresql://staffbot:DB_PASS_REDACTED@db:5432/staffbot_db
      - STAFFBOT_PROFILES_DIR=/app/data/profiles
      - MIMO_BASE=https://jemaahapi.tail5cfbb9.ts.net/v1
      - MIMO_KEY=sk-jemaah-mimo-key-2024-prod
      - SECRET_KEY=SECRET_KEY_REDACTED
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/staffbot/containers:/root/staffbot/containers
      - /root/staffbot/api/app/static:/app/app/static
      - /etc/nginx/ssl:/etc/nginx/ssl
      - /root/staffbot/profiles:/app/data/profiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - staffbot-network

volumes:
  postgres_data:
    external: true

networks:
  staffbot-network:
    driver: bridge
