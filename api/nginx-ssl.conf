# StaffBot.my — Nginx Reverse Proxy Config (SSL)
# Place in: /etc/nginx/sites-available/staffbot.my
# Then: ln -sf /etc/nginx/sites-available/staffbot.my /etc/nginx/sites-enabled/
# Then: rm -f /etc/nginx/sites-enabled/default (remove default site)

server {
    listen 80;
    listen [::]:80;
    server_name staffbot.my api.staffbot.my;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staffbot.my api.staffbot.my;

    # SSL — managed by Certbot
    ssl_certificate /etc/letsencrypt/live/staffbot.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staffbot.my/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Everything proxied to FastAPI backend
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;

        # WebSocket support for dashboard chat
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Let's Encrypt challenge (outside /root so nginx can access)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
